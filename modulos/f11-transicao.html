<script>
(function () {
  'use strict';
  function el(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function(c) { return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]; }); }

  var NOMES_FASE_SEM = { planejamento: 'Planejamento', inscricoes: 'Inscrições', em_andamento: 'Em andamento', encerrado: 'Encerrado' };

  // O que cada fase do roteiro vai trazer para esta tela (claude/transicao-semestre.md, seção 10).
  var FERRAMENTAS = [
    { icone: 'quiz',             nome: 'Nivelamento',              desc: 'Vagas, agendamento, provas e resultado.' },
    { icone: 'person_add',       nome: 'Matrícula de novatos',     desc: 'Solicitações, documentos, classificação e lista de espera.' },
    { icone: 'flag',             nome: 'Virada do semestre',       desc: 'O próximo semestre passa a ser o atual.' },
  ];

  function fmt(iso) {
    if (!iso) return '';
    var d = new Date(iso);
    if (isNaN(d)) return '';
    return d.toLocaleDateString('pt-BR', { timeZone: 'America/Fortaleza', day: '2-digit', month: '2-digit', year: 'numeric' }) + ' ' +
           d.toLocaleTimeString('pt-BR', { timeZone: 'America/Fortaleza', hour: '2-digit', minute: '2-digit' });
  }

  function estadoVazio(icone, texto) {
    el('tr11-raiz').innerHTML = '<div class="tr11-estado"><span class="material-icons-round">' + icone + '</span><p>' + texto + '</p></div>';
  }

  function render(c) {
    var agora = c.agora ? new Date(c.agora).getTime() : Date.now();
    var p = c.proximo, cfg = c.config || {};
    var fases = c.fases || [];
    var proxima = null;
    fases.forEach(function(f) {
      var ini = f.inicio ? new Date(f.inicio).getTime() : null;
      var fim = f.fim ? new Date(f.fim).getTime() : null;
      if (ini === null && fim === null) f._st = 'sem';
      else if (fim !== null && fim < agora) f._st = 'passou';
      else if (ini !== null && ini > agora) f._st = 'futura';
      else f._st = 'agora';
      if (f._st === 'futura' && (!proxima || ini < new Date(proxima.inicio).getTime())) proxima = f;
    });
    var definidas = fases.filter(function(f) { return f._st !== 'sem'; }).length;

    var tl = fases.map(function(f) {
      var cls = f._st === 'agora' ? 'agora' : f === proxima ? 'proxima' : f._st === 'passou' ? 'passou' : '';
      var quando;
      if (f._st === 'sem') quando = '<div class="tr11-quando vazio">a definir</div>';
      else {
        quando = '<div class="tr11-quando">' +
          (f.inicio ? fmt(f.inicio) : '—') + '<br>' + (f.fim ? fmt(f.fim) : '—') +
          (f._st === 'agora' ? '<br><span class="tr11-selo agora">Agora</span>' : f === proxima ? '<br><span class="tr11-selo proxima">Próxima</span>' : '') +
          '</div>';
      }
      return '<li class="' + cls + '">' +
        '<span class="tr11-num">' + f.ordem + '</span>' +
        '<div><div class="tr11-nome">' + esc(f.nome) + '</div>' +
          (f.descricao ? '<div class="tr11-desc">' + esc(f.descricao) + '</div>' : '') +
          (f.observacao ? '<div class="tr11-obs">' + esc(f.observacao) + '</div>' : '') +
        '</div>' + quando + '</li>';
    }).join('');

    function op(nome, v) {
      return '<div class="tr11-op"><span>' + nome + '</span><span class="tr11-val ' + (v ? 'sim' : 'nao') + '">' + (v ? 'Ligada' : 'Desligada') + '</span></div>';
    }
    function opNum(nome, v) {
      return '<div class="tr11-op"><span>' + nome + '</span><span class="tr11-val num">' + esc(v == null ? '—' : v) + '</span></div>';
    }
    var opcoes =
      op('Manter a modalidade na rematrícula', cfg.manter_modalidade) +
      op('Impedimento do Decreto 46.371', cfg.aplicar_decreto_46371) +
      op('Frequência abaixo de 75% = desistente', cfg.freq_baixa_desistente) +
      op('Autoinscrição online no nivelamento', cfg.autoinscricao_nivelamento) +
      opNum('Teto da cota prioritária', cfg.cota_prioritaria_pct == null ? null : cfg.cota_prioritaria_pct + '%') +
      opNum('Lembrete de importação a cada', cfg.limite_lembrete_documentos);

    var ferr = FERRAMENTAS.map(function(f) {
      return '<div class="tr11-ferr"><span class="material-icons-round">' + f.icone + '</span><div><b>' + esc(f.nome) + '</b><span class="d">' + esc(f.desc) + '</span></div></div>';
    }).join('');

    var atual = c.atual ? (c.atual.rotulo || c.atual.external_id) : '—';
    var visao =
      '<div class="tr11-topo">' +
        '<div><div class="tr11-rot">Transição de semestre</div>' +
          '<div class="tr11-sem">' + esc(atual) + '<span class="material-icons-round">arrow_forward</span>' + esc(p.rotulo) + '</div></div>' +
        '<div class="tr11-chips">' +
          '<span class="tr11-chip aviso">' + esc(NOMES_FASE_SEM[p.fase] || p.fase) + '</span>' +
          (p.visualizacao_ativa === false ? '<span class="tr11-chip">Semestre oculto</span>' : '<span class="tr11-chip ok">Semestre visível</span>') +
          '<span class="tr11-chip">' + definidas + ' de ' + fases.length + ' fases com data</span>' +
        '</div>' +
      '</div>';
    var grade =
      '<div class="tr11-grade">' +
        '<div class="tr11-card"><div class="tr11-card-h"><span class="material-icons-round">timeline</span>Calendário do ciclo</div>' +
          '<div class="tr11-card-c"><ul class="tr11-tl">' + tl + '</ul>' +
          '<div class="tr11-nota">Horários de Brasília. As datas são definidas pelo admin em Configurações → Transição.</div></div></div>' +
        '<div>' +
          '<div class="tr11-card"><div class="tr11-card-h"><span class="material-icons-round">tune</span>Opções do ciclo</div>' +
            '<div class="tr11-card-c">' + opcoes + '<div class="tr11-nota">Somente o admin altera (Configurações → Transição).</div></div></div>' +
          '<div class="tr11-card"><div class="tr11-card-h"><span class="material-icons-round">construction</span>Ferramentas da transição</div>' +
            '<div class="tr11-card-c">' + ferr + '<div class="tr11-nota">Entram nesta tela à medida que cada etapa for liberada.</div></div></div>' +
        '</div>' +
      '</div>';
    // Secretaria (D-08): só a aba Rematrícula.
    if (soSecretaria()) {
      el('tr11-raiz').innerHTML = visao +
        '<div class="tr11-abas" id="tr11-abas">' +
          '<button class="tr11-aba" data-aba="remat"><span class="material-icons-round">how_to_reg</span>Rematrícula ' + esc(p.rotulo) + '</button>' +
        '</div>' +
        '<div class="tr11-painel" data-painel="remat" id="tr11-remat"></div>';
      iniciarAbas();
      return;
    }
    el('tr11-raiz').innerHTML = visao +
      '<div class="tr11-abas" id="tr11-abas">' +
        '<button class="tr11-aba" data-aba="visao"><span class="material-icons-round">dashboard</span>Visão geral</button>' +
        '<button class="tr11-aba" data-aba="turmas"><span class="material-icons-round">groups</span>Turmas do ' + esc(p.rotulo) + '</button>' +
        '<button class="tr11-aba" data-aba="disp"><span class="material-icons-round">event_available</span>Disponibilidade</button>' +
        '<button class="tr11-aba" data-aba="enc"><span class="material-icons-round">verified</span>Encerramento do ' + esc(atual) + '</button>' +
        '<button class="tr11-aba" data-aba="remat"><span class="material-icons-round">how_to_reg</span>Rematrícula ' + esc(p.rotulo) + '</button>' +
      '</div>' +
      '<div class="tr11-painel" data-painel="visao">' + grade + '</div>' +
      '<div class="tr11-painel" data-painel="turmas" id="tr11-turmas"></div>' +
      '<div class="tr11-painel" data-painel="disp" id="tr11-disp"></div>' +
      '<div class="tr11-painel" data-painel="enc" id="tr11-enc"></div>' +
      '<div class="tr11-painel" data-painel="remat" id="tr11-remat"></div>';
    iniciarAbas();
    Turmas.iniciar(c);
    Disp.iniciar(c);
  }
  function soSecretaria() {
    var u = (typeof App !== 'undefined') ? App.usuario : null;
    return !!u && (u.papel || u.Papel || '') === 'secretaria';
  }

  // ── Abas (a última aberta fica guardada até fechar o navegador) ──────────
  var CHAVE_ABA = 'sge.transicao.aba';
  function mostrarAba(nome) {
    if (soSecretaria()) nome = 'remat';
    if (['visao', 'turmas', 'disp', 'enc', 'remat'].indexOf(nome) === -1) nome = 'visao';
    if (nome === 'disp' && typeof Disp !== 'undefined') Disp.atualizar();
    if (nome === 'enc' && typeof Enc !== 'undefined') Enc.atualizar();
    if (nome === 'remat' && typeof Remat !== 'undefined') Remat.atualizar();
    document.querySelectorAll('#tr11-abas .tr11-aba').forEach(function(b) { b.classList.toggle('ativa', b.dataset.aba === nome); });
    document.querySelectorAll('#tr11-raiz .tr11-painel').forEach(function(p) { p.classList.toggle('ativo', p.dataset.painel === nome); });
    try { sessionStorage.setItem(CHAVE_ABA, nome); } catch (e) {}
  }
  function iniciarAbas() {
    document.querySelectorAll('#tr11-abas .tr11-aba').forEach(function(b) {
      b.addEventListener('click', function() { mostrarAba(b.dataset.aba); });
    });
    var salva = null;
    try { salva = sessionStorage.getItem(CHAVE_ABA); } catch (e) {}
    mostrarAba(salva || 'visao');
  }

  // ===========================================================================
  // TURMAS DO PRÓXIMO SEMESTRE (etapa 18 — D-47, D-48, D-51, D-55)
  // Tudo passa por funções do banco que conferem o papel (admin/coordenação)
  // e só mexem no próximo semestre: virada, turma nova/edição, professor,
  // exclusão e renumeração.
  // ===========================================================================
  var Turmas = (function() {
    var T = { ciclo: null, prox: null, turmas: [], cursos: [], idiomas: [], profs: [],
              filtroIdioma: '', busca: '', soSemProf: false, editando: null, atribuindo: null, virada: [] };
    var DIAS = [[1, 'Seg'], [2, 'Ter'], [3, 'Qua'], [4, 'Qui'], [5, 'Sex'], [6, 'Sáb']];
    var DIA_NUM = { 'SEGUNDA-FEIRA': 1, 'SEGUNDA': 1, 'TERCA-FEIRA': 2, 'TERÇA-FEIRA': 2, 'TERCA': 2, 'TERÇA': 2,
                    'QUARTA-FEIRA': 3, 'QUARTA': 3, 'QUINTA-FEIRA': 4, 'QUINTA': 4, 'SEXTA-FEIRA': 5, 'SEXTA': 5,
                    'SABADO': 6, 'SÁBADO': 6 };
    function api(a, d) { return window.postApi(a, d); }
    function aviso(msg, tipo) { if (typeof toast === 'function') toast(msg, tipo || 'success'); }
    function diasNums(txt) {
      var out = [];
      String(txt || '').split(',').forEach(function(d) { var n = DIA_NUM[d.trim().toUpperCase()]; if (n && out.indexOf(n) === -1) out.push(n); });
      return out.sort();
    }
    function diasCurto(txt) {
      var n = diasNums(txt);
      if (!n.length) return esc(txt || '—');
      return n.map(function(x) { return DIAS[x - 1][1]; }).join(', ');
    }
    function nomeProf(id) {
      var p = T.profs.filter(function(x) { return x.id === id; })[0];
      return p ? p.nome : '';
    }
    // Professor atual que não está na lista (ex.: usuário que deixou de ser
    // professor): entra como opção para não ser apagado sem querer ao salvar.
    function garantirOpcao(selId, t) {
      var sel = el(selId);
      if (!t || !t.professor_id || sel.querySelector('option[value="' + t.professor_id + '"]')) return;
      var o = document.createElement('option');
      o.value = t.professor_id; o.textContent = (t.professor && t.professor.nome) || 'Professor atual';
      o.dataset.nome = o.textContent;
      sel.appendChild(o);
    }
    function cursoDe(id) { return T.cursos.filter(function(c) { return c.id === id; })[0] || null; }

    function iniciar(ciclo) {
      T.ciclo = ciclo; T.prox = ciclo.proximo;
      var box = el('tr11-turmas');
      box.innerHTML = '<div class="tr11-estado"><div class="spinner" style="margin:0 auto 10px;"></div><p>Carregando turmas…</p></div>';
      Promise.all([
        api('turmas.listar', { semestre_id: T.prox.id }),
        api('cursos.listar', {}),
        api('usuarios.listar', {}),
      ]).then(function(r) {
        if (!r[0].sucesso) { box.innerHTML = '<div class="tt-vazio">Erro ao carregar as turmas: ' + esc(r[0].mensagem) + '</div>'; return; }
        T.turmas = r[0].dados || [];
        T.cursos = (r[1].sucesso && r[1].dados) ? r[1].dados.filter(function(c) { return c.ativo !== false; }) : [];
        T.cursos.sort(function(a, b) { return String(a.external_id).localeCompare(String(b.external_id), 'pt-BR', { numeric: true }); });
        var mapaId = {};
        T.cursos.forEach(function(c) { if (c.idiomas && c.idiomas.id && !mapaId[c.idiomas.id]) mapaId[c.idiomas.id] = c.idiomas.nome; });
        T.idiomas = Object.keys(mapaId).map(function(id) { return { id: id, nome: mapaId[id] }; })
          .sort(function(a, b) { return a.nome.localeCompare(b.nome, 'pt-BR'); });
        T.profs = ((r[2].sucesso && r[2].dados) ? r[2].dados : [])
          .filter(function(u) { return u.papel === 'professor' && u.situacao_ativo !== false; })
          .sort(function(a, b) { return String(a.nome).localeCompare(String(b.nome), 'pt-BR', { sensitivity: 'base' }); });
        montar();
      }).catch(function() { box.innerHTML = '<div class="tt-vazio">Erro de comunicação.</div>'; });
    }

    function recarregar() {
      return api('turmas.listar', { semestre_id: T.prox.id }).then(function(res) {
        if (res.sucesso) { T.turmas = res.dados || []; renderLista(); }
      });
    }

    function montar() {
      var box = el('tr11-turmas');
      box.innerHTML =
        '<div class="tt-resumo" id="tt-resumo"></div>' +
        '<div class="tt-barra">' +
          '<select class="tt-select" id="tt-f-idioma"><option value="">Todos os idiomas</option>' +
            T.idiomas.map(function(i) { return '<option value="' + esc(i.id) + '">' + esc(i.nome) + '</option>'; }).join('') + '</select>' +
          '<input type="search" class="tt-input tt-busca" id="tt-f-busca" placeholder="Buscar código, curso ou professor…">' +
          '<label class="tt-chk"><input type="checkbox" id="tt-f-semprof">Só sem professor</label>' +
          '<span class="tt-espaco"></span>' +
          '<button class="tt-btn prim" id="tt-b-virar"><span class="material-icons-round">autorenew</span>Virar turmas</button>' +
          '<button class="tt-btn" id="tt-b-nova"><span class="material-icons-round">add</span>Nova turma</button>' +
          '<button class="tt-btn" id="tt-b-renum"><span class="material-icons-round">format_list_numbered</span>Renumerar</button>' +
        '</div>' +
        '<div class="tt-card"><div class="tt-tabela-wrap"><table class="tt-tabela">' +
          '<thead><tr><th>Código</th><th>Curso</th><th>Dia · Horário</th><th>Turno</th><th>Mod.</th><th>Vagas</th><th>Professor</th><th></th></tr></thead>' +
          '<tbody id="tt-corpo"></tbody></table></div></div>' +
        modais();
      el('tt-f-idioma').addEventListener('change', function() { T.filtroIdioma = this.value; renderLista(); });
      el('tt-f-busca').addEventListener('input', function() { T.busca = this.value.trim().toLowerCase(); renderLista(); });
      el('tt-f-semprof').addEventListener('change', function() { T.soSemProf = this.checked; renderLista(); });
      el('tt-b-virar').addEventListener('click', abrirVirada);
      el('tt-b-nova').addEventListener('click', function() { abrirEdicao(null); });
      el('tt-b-renum').addEventListener('click', renumerar);
      // modais
      document.querySelectorAll('#tr11-turmas [data-fechar]').forEach(function(b) {
        b.addEventListener('click', function() { fechar(b.dataset.fechar); });
      });
      document.querySelectorAll('#tr11-turmas .tt-overlay').forEach(function(o) {
        o.addEventListener('click', function(e) { if (e.target === o) fechar(o.id); });
      });
      el('tt-v-idioma').addEventListener('change', carregarCandidatas);
      el('tt-v-todas').addEventListener('click', function() { marcarTodas(true); });
      el('tt-v-nenhuma').addEventListener('click', function() { marcarTodas(false); });
      el('tt-v-ok').addEventListener('click', executarVirada);
      el('tt-e-curso').addEventListener('change', function() {
        var c = cursoDe(this.value); if (c) el('tt-e-estagio').value = String(c.nome || '').toUpperCase();
      });
      el('tt-e-ok').addEventListener('click', function() { salvarEdicao(false); });
      el('tt-a-ok').addEventListener('click', function() { salvarAtribuicao(false); });
      el('tt-a-prof').addEventListener('change', mostrarCargaProf);
      renderLista();
    }

    function opcoesProf() {
      return '<option value="">— A definir —</option>' + T.profs.map(function(p) {
        return '<option value="' + esc(p.id) + '" data-nome="' + esc(p.nome) + '">' + esc(p.nome) + '</option>'; }).join('');
    }

    function modais() {
      var optsCursos = T.idiomas.map(function(i) {
        var cs = T.cursos.filter(function(c) { return c.idiomas && c.idiomas.id === i.id; });
        if (!cs.length) return '';
        return '<optgroup label="' + esc(i.nome) + '">' + cs.map(function(c) {
          return '<option value="' + esc(c.id) + '">' + esc(c.sigla) + ' · ' + esc(c.nome) + '</option>'; }).join('') + '</optgroup>';
      }).join('');
      var optsProf = opcoesProf();
      return '' +
      // Virada
      '<div class="tt-overlay" id="tt-m-virada"><div class="tt-modal largo">' +
        '<div class="tt-modal-h">Virar turmas para ' + esc(T.prox.rotulo) + '<button class="tt-ico" data-fechar="tt-m-virada"><span class="material-icons-round">close</span></button></div>' +
        '<div class="tt-modal-c">' +
          '<div class="tt-alerta" id="tt-v-alerta"></div>' +
          '<p class="tt-aviso">Cada turma marcada vira uma turma do ' + esc(T.prox.rotulo) + ' no <strong>curso seguinte</strong>, com o mesmo dia, horário, modalidade, turno e vagas. O professor fica <strong>a definir</strong>; o código troca o semestre e a sigla e mantém o número. Turmas de curso sem continuidade não viram.</p>' +
          '<div class="tt-barra"><select class="tt-select" id="tt-v-idioma"><option value="">Escolha o idioma…</option>' +
            T.idiomas.map(function(i) { return '<option value="' + esc(i.id) + '">' + esc(i.nome) + '</option>'; }).join('') + '</select>' +
            '<span class="tt-espaco"></span>' +
            '<button class="tt-btn" id="tt-v-todas">Marcar todas</button><button class="tt-btn" id="tt-v-nenhuma">Desmarcar</button></div>' +
          '<div class="tt-vlista" id="tt-v-lista"><div class="tt-vazio">Escolha o idioma.</div></div>' +
        '</div>' +
        '<div class="tt-modal-f"><button class="tt-btn" data-fechar="tt-m-virada">Fechar</button>' +
          '<button class="tt-btn prim" id="tt-v-ok" disabled><span class="material-icons-round">autorenew</span><span id="tt-v-ok-txt">Virar turmas</span></button></div>' +
      '</div></div>' +
      // Edição
      '<div class="tt-overlay" id="tt-m-edicao"><div class="tt-modal">' +
        '<div class="tt-modal-h"><span id="tt-e-titulo">Nova turma</span><button class="tt-ico" data-fechar="tt-m-edicao"><span class="material-icons-round">close</span></button></div>' +
        '<div class="tt-modal-c">' +
          '<div class="tt-alerta" id="tt-e-alerta"></div>' +
          '<div class="tt-grid">' +
            '<div class="tt-campo span2"><label for="tt-e-curso">Curso</label><select class="tt-select" id="tt-e-curso"><option value="">Escolha o curso…</option>' + optsCursos + '</select></div>' +
            '<div class="tt-campo span2"><label for="tt-e-estagio">Estágio</label><input class="tt-input" id="tt-e-estagio" maxlength="80"></div>' +
            '<div class="tt-campo span2"><label>Dias de aula</label><div class="tt-dias" id="tt-e-dias">' +
              DIAS.map(function(d) { return '<label><input type="checkbox" value="' + d[0] + '">' + d[1] + '</label>'; }).join('') + '</div></div>' +
            '<div class="tt-campo"><label for="tt-e-horario">Horário</label><input class="tt-input" id="tt-e-horario" placeholder="Ex.: 14h às 15h30" maxlength="40"></div>' +
            '<div class="tt-campo"><label for="tt-e-turno">Turno</label><select class="tt-select" id="tt-e-turno"><option value="">Escolha…</option><option>MANHÃ</option><option>TARDE</option><option>NOITE</option></select></div>' +
            '<div class="tt-campo"><label for="tt-e-mod">Modalidade</label><select class="tt-select" id="tt-e-mod"><option value="PRESENCIAL">Presencial</option><option value="EAD">EAD</option></select></div>' +
            '<div class="tt-campo"><label for="tt-e-vagas">Vagas totais</label><input type="number" class="tt-input" id="tt-e-vagas" min="1" max="99" step="1"></div>' +
            '<div class="tt-campo span2"><label for="tt-e-prof">Professor</label><select class="tt-select" id="tt-e-prof">' + optsProf + '</select></div>' +
          '</div>' +
        '</div>' +
        '<div class="tt-modal-f"><button class="tt-btn" data-fechar="tt-m-edicao">Cancelar</button>' +
          '<button class="tt-btn prim" id="tt-e-ok"><span class="material-icons-round">save</span>Salvar</button></div>' +
      '</div></div>' +
      // Atribuição
      '<div class="tt-overlay" id="tt-m-atrib"><div class="tt-modal">' +
        '<div class="tt-modal-h"><span id="tt-a-titulo">Professor</span><button class="tt-ico" data-fechar="tt-m-atrib"><span class="material-icons-round">close</span></button></div>' +
        '<div class="tt-modal-c">' +
          '<div class="tt-alerta" id="tt-a-alerta"></div>' +
          '<p class="tt-aviso" id="tt-a-info"></p>' +
          '<div class="tt-campo"><label for="tt-a-prof">Professor</label><select class="tt-select" id="tt-a-prof">' + optsProf + '</select></div>' +
          '<p class="tt-aviso" id="tt-a-carga" style="margin-top:10px;"></p>' +
        '</div>' +
        '<div class="tt-modal-f"><button class="tt-btn" data-fechar="tt-m-atrib">Cancelar</button>' +
          '<button class="tt-btn prim" id="tt-a-ok"><span class="material-icons-round">save</span>Salvar</button></div>' +
      '</div></div>';
    }

    function abrir(id) { el(id).classList.add('show'); }
    function fechar(id) { el(id).classList.remove('show'); }
    function alerta(id, msg, ok) {
      var a = el(id); if (!a) return;
      a.textContent = msg || ''; a.className = 'tt-alerta' + (msg ? ' show' : '') + (ok ? ' ok' : '');
    }

    // ── Lista ─────────────────────────────────────────────────────────────
    function renderLista() {
      var semProf = T.turmas.filter(function(t) { return !t.professor_id; }).length;
      var viradas = T.turmas.filter(function(t) { return !!t.virada_de_turma_id; }).length;
      var vagas = T.turmas.reduce(function(s, t) { return s + (Number(t.vagas_totais) || 0); }, 0);
      el('tt-resumo').innerHTML =
        '<div class="tt-resumo-item"><b>' + T.turmas.length + '</b>turmas</div>' +
        '<div class="tt-resumo-item"><b>' + viradas + '</b>viradas</div>' +
        '<div class="tt-resumo-item"><b>' + (T.turmas.length - viradas) + '</b>novas</div>' +
        '<div class="tt-resumo-item' + (semProf ? ' alerta' : '') + '"><b>' + semProf + '</b>sem professor</div>' +
        '<div class="tt-resumo-item"><b>' + vagas + '</b>vagas</div>';
      var lista = T.turmas.filter(function(t) {
        var c = cursoDe(t.curso_id);
        if (T.filtroIdioma && !(c && c.idiomas && c.idiomas.id === T.filtroIdioma)) return false;
        if (T.soSemProf && t.professor_id) return false;
        if (T.busca) {
          var alvo = [t.external_id, t.estagio, c && c.nome, c && c.sigla, nomeProf(t.professor_id)].join(' ').toLowerCase();
          if (alvo.indexOf(T.busca) === -1) return false;
        }
        return true;
      });
      var corpo = el('tt-corpo');
      if (!lista.length) {
        corpo.innerHTML = '<tr><td colspan="8"><div class="tt-vazio">' +
          (T.turmas.length ? 'Nenhuma turma com estes filtros.' : 'Ainda não há turmas no ' + esc(T.prox.rotulo) + '. Comece por <strong>Virar turmas</strong>.') + '</div></td></tr>';
        return;
      }
      corpo.innerHTML = lista.map(function(t) {
        var c = cursoDe(t.curso_id) || {};
        var prof = t.professor_id ? esc(nomeProf(t.professor_id) || (t.professor && t.professor.nome) || '—') : '<span class="tt-adef">a definir</span>';
        return '<tr data-id="' + esc(t.id) + '">' +
          '<td class="tt-cod">' + esc(t.external_id) + (t.virada_de_turma_id ? '<span class="tt-selo virada" title="Veio da virada">virada</span>' : '<span class="tt-selo nova">nova</span>') + '</td>' +
          '<td>' + esc(t.estagio || c.nome || '—') + '<span class="tt-sub">' + esc(c.sigla || '') + '</span></td>' +
          '<td>' + diasCurto(t.dia_semana) + '<span class="tt-sub">' + esc(t.horario || '—') + '</span></td>' +
          '<td>' + esc(t.turno || '—') + '</td>' +
          '<td>' + esc(t.modalidade || '—') + '</td>' +
          '<td>' + esc(t.vagas_totais == null ? '—' : t.vagas_totais) + '</td>' +
          '<td><button class="tt-prof" data-acao="prof">' + prof + '<span class="material-icons-round">edit</span></button></td>' +
          '<td><div class="tt-acoes">' +
            '<button class="tt-ico" data-acao="editar" title="Editar"><span class="material-icons-round">edit_note</span></button>' +
            '<button class="tt-ico perigo" data-acao="excluir" title="Excluir"><span class="material-icons-round">delete</span></button>' +
          '</div></td></tr>';
      }).join('');
      corpo.querySelectorAll('button[data-acao]').forEach(function(b) {
        b.addEventListener('click', function() {
          var id = b.closest('tr').dataset.id;

    // ── Virada ────────────────────────────────────────────────────────────

    function carregarCandidatas() {

        if (!res.sucesso) { lista.innerHTML = '<div class="tt-vazio">' + esc(res.mensagem) + '</div>'; return; }
        T.virada = res.dados || [];
        if (!T.virada.length) { lista.innerHTML = '<div class="tt-vazio">Nenhuma turma deste idioma no semestre atual.</div>'; return; }
        lista.innerHTML = T.virada.map(function(v, i) {
          var pode = !!v.proximo && !v.virada;

                     : !v.proximo ? '<span class="tt-motivo">curso sem continuidade</span>'

          return '<label class="tt-vitem' + (pode ? '' : ' off') + '">' +
            '<input type="checkbox" data-i="' + i + '"' + (pode ? '' : ' disabled') + (marcada ? ' checked' : '') + '>' +
            '<span><span class="tt-seta">' + esc(v.external_id) + (v.proximo ? ' → ' + esc(v.codigo_previsto) : '') + '</span>' +
              '<span class="tt-sub">' + esc(v.curso_nome) + (v.proximo ? ' → ' + esc(v.proximo.nome) : '') + ' · ' + diasCurto(v.dia_semana) + ' ' + esc(v.horario || '') + ' · ' + esc(v.modalidade || '') + ' · ' + esc(v.vagas_totais) + ' vagas</span></span>' +
            motivo + '</label>';
        }).join('');
        lista.querySelectorAll('input[type=checkbox]').forEach(function(c) { c.addEventListener('change', atualizarBotaoVirada); });

    function atualizarBotaoVirada() {

    function executarVirada() {
      var ids = marcados(); if (!ids.length) return;
      if (!confirm('Criar ' + ids.length + ' turma(s) no ' + T.prox.rotulo + '?')) return;
      el('tt-v-ok').disabled = true;
      api('transicao.virar', { turma_ids: ids }).then(function(res) {
        if (!res.sucesso) { alerta('tt-v-alerta', res.mensagem); atualizarBotaoVirada(); return; }

    // ── Nova turma / edição ──────────────────────────────────────────────

    // ── Professor ────────────────────────────────────────────────────────
    function abrirAtribuicao(t) {
      T.atribuindo = t;
      alerta('tt-a-alerta', '');
      el('tt-a-titulo').textContent = 'Professor da turma ' + t.external_id;
      el('tt-a-prof').innerHTML = opcoesProf();   // a lista agrupada chega logo em seguida
      el('tt-a-info').innerHTML = esc(t.estagio || '') + ' · ' + diasCurto(t.dia_semana) + ' ' + esc(t.horario || '') + ' · ' + esc(t.turno || '') + ' · ' + esc(t.modalidade || '');

    // Lista de professores separada pela disponibilidade para esta turma:
    // disponíveis neste dia/horário, marcaram mas fora deste horário, e não
    // marcaram. Em cada grupo, ordem alfabética, com as turmas que já têm.
    var GRUPOS_DISP = [
      ['ok', 'Com disponibilidade neste dia e horário'],
      ['fora', 'Marcaram disponibilidade, mas não neste dia/horário'],
      ['sem_marcacao', 'Não marcaram disponibilidade'],
      ['outro', 'Outros']
    ];
    function marcarDisponiveis(t) {
      var sel = el('tt-a-prof');
      api('disp.professoresTurma', { turma_id: t.id }).then(function(res) {
        if (!res.sucesso || !res.dados || T.atribuindo !== t) return;
        var mapa = res.dados, valor = sel.value;
        var atuais = Array.prototype.filter.call(sel.querySelectorAll('option'), function(o) { return o.value; })
          .map(function(o) { return { id: o.value, nome: o.dataset.nome || o.textContent }; });
        var grupos = {};
        atuais.forEach(function(p) {
          var st = mapa[p.id] || 'outro';
          (grupos[st] = grupos[st] || []).push(p);
        });
        var html = '<option value="">— A definir —</option>';
        GRUPOS_DISP.forEach(function(g) {
          var lista = grupos[g[0]]; if (!lista || !lista.length) return;
          lista.sort(function(a, b) { return a.nome.localeCompare(b.nome, 'pt-BR', { sensitivity: 'base' }); });
          html += '<optgroup label="' + esc(g[1]) + ' (' + lista.length + ')">' + lista.map(function(p) {
            var n = T.turmas.filter(function(x) { return x.professor_id === p.id && x.id !== t.id; }).length;
            return '<option value="' + esc(p.id) + '" data-nome="' + esc(p.nome) + '">' + (g[0] === 'ok' ? '✓ ' : '') + esc(p.nome) +
              (n ? ' · ' + n + ' turma' + (n > 1 ? 's' : '') : '') + '</option>';
          }).join('') + '</optgroup>';
        });
        sel.innerHTML = html;
        sel.value = valor;
      });
    }
    function mostrarCargaProf() {
      var id = el('tt-a-prof').value, box = el('tt-a-carga');
      if (!id) { box.textContent = 'A turma fica com professor "a definir".'; return; }
      var dele = T.turmas.filter(function(t) { return t.professor_id === id && (!T.atribuindo || t.id !== T.atribuindo.id); });
      box.innerHTML = dele.length
        ? 'Já tem ' + dele.length + ' turma(s) no ' + esc(T.prox.rotulo) + ': ' + dele.map(function(t) { return esc(t.external_id) + ' (' + diasCurto(t.dia_semana) + ' ' + esc(t.horario || '') + ')'; }).join(', ') + '.'
        : 'Ainda sem turmas no ' + esc(T.prox.rotulo) + '.';
    }
    function salvarAtribuicao(forcar) {
      var t = T.atribuindo; if (!t) return;
      var prof = el('tt-a-prof').value || null;
      el('tt-a-ok').disabled = true;
      api('transicao.turmaAtribuir', { turma_id: t.id, professor_id: prof, forcar: forcar === true }).then(function(res) {
        el('tt-a-ok').disabled = false;
        if (!res.sucesso && res.dados && res.dados.confirmacaoNecessaria) {
          if (confirm(res.mensagem + '\n\nAtribuir mesmo assim?')) salvarAtribuicao(true);
          return;
        }
        if (!res.sucesso) return alerta('tt-a-alerta', res.mensagem);
        fechar('tt-m-atrib');
        aviso(prof ? 'Professor atribuído à ' + t.external_id + '.' : 'Turma ' + t.external_id + ' com professor a definir.');

    // ── Excluir / renumerar ──────────────────────────────────────────────
    function excluir(t) {
      var msg = 'Excluir a turma ' + t.external_id + '?' +
        (t.virada_de_turma_id ? '\n\nEla veio da virada: a turma de origem volta a poder ser virada.' : '');
      if (!confirm(msg)) return;

        if (!res.sucesso) return aviso(res.mensagem, 'error');

    function renumerar() {
      if (!T.turmas.length) return aviso('Não há turmas para renumerar.', 'error');
      if (!confirm('Renumerar as ' + T.turmas.length + ' turmas do ' + T.prox.rotulo + '?\n\n' +
        'Os códigos são refeitos (001, 002…) na ordem dos cursos, do dia e do horário. ' +
        'Só é possível antes do início da rematrícula e enquanto nenhuma turma tiver matrícula.')) return;
      el('tt-b-renum').disabled = true;

        el('tt-b-renum').disabled = false;
        if (!res.sucesso) return aviso(res.mensagem, 'error');

    return { iniciar: iniciar };
  }());

  // ===========================================================================
  // DISPONIBILIDADE DOS PROFESSORES (etapa 19 — D-52 a D-54)
  // Slots (dia + horário + turno) montados pela coordenação; mínimo padrão e
  // individual; painel de quem já marcou; marcar por um professor.
  // ===========================================================================
  var Disp = (function() {
    var D = { ciclo: null, prox: null, dados: null, carregado: false, soPendentes: false, slotEdit: null, profMarcar: null };
    var NOME_DIA = ['', 'Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado'];
    function api(a, d) { return window.postApi(a, d); }
    function aviso(msg, tipo) { if (typeof toast === 'function') toast(msg, tipo || 'success'); }
    function fmtDH(iso) {
      if (!iso) return '—';
      var d = new Date(iso); if (isNaN(d)) return '—';
      return d.toLocaleDateString('pt-BR', { timeZone: 'America/Fortaleza', day: '2-digit', month: '2-digit' }) + ' ' +
             d.toLocaleTimeString('pt-BR', { timeZone: 'America/Fortaleza', hour: '2-digit', minute: '2-digit' });
    }
    function situacao(p) {
      if (!p.marcados) return { cls: 'nao', txt: 'Não marcou' };
      var faltam = [];
      if (p.marcados < p.minimo) faltam.push('Faltam ' + (p.minimo - p.marcados));
      var sab = p.minimo_sabado || 0, msab = p.marcados_sabado || 0;
      if (msab < sab) faltam.push((faltam.length ? '' : 'Faltam ') + (sab - msab) + ' no sábado');
      if (faltam.length) return { cls: 'falta', txt: faltam.join(' + ') };
      return { cls: 'ok', txt: 'OK' };
    }

    function iniciar(ciclo) { D.ciclo = ciclo; D.prox = ciclo.proximo; D.carregado = false; }

    // ── Planilha (.xlsx) para distribuir as turmas no Excel ────────────────
    // Biblioteca SheetJS carregada só quando necessária (a mesma usada em
    // Relatórios → Baixar XLSX).
    function carregarLibXLSX() {
      if (window.XLSX) return Promise.resolve(window.XLSX);
      if (window.__xlsxCarregando) return window.__xlsxCarregando;
      window.__xlsxCarregando = new Promise(function(resolve, reject) {
        var sc = document.createElement('script');
        sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
        sc.onload = function() { resolve(window.XLSX); };
        sc.onerror = function() { window.__xlsxCarregando = null; reject(new Error('Não foi possível carregar a biblioteca da planilha. Verifique a conexão e tente novamente.')); };
        document.head.appendChild(sc);
      });
      return window.__xlsxCarregando;
    }
    var DIA_CURTO = ['', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
    var DIA_NUM_X = { 'SEGUNDA-FEIRA': 1, 'SEGUNDA': 1, 'TERCA-FEIRA': 2, 'TERÇA-FEIRA': 2, 'TERCA': 2, 'TERÇA': 2,
                      'QUARTA-FEIRA': 3, 'QUARTA': 3, 'QUINTA-FEIRA': 4, 'QUINTA': 4, 'SEXTA-FEIRA': 5, 'SEXTA': 5,
                      'SABADO': 6, 'SÁBADO': 6 };
    function diasDe(txt) {
      var out = [];
      String(txt || '').split(',').forEach(function(d) { var n = DIA_NUM_X[d.trim().toUpperCase()]; if (n && out.indexOf(n) === -1) out.push(n); });
      return out.sort();
    }
    // Mesma leitura de horário do banco (turma_horario_intervalo): minutos [ini, fim).
    function intervalo(h) {
      var m = String(h || '').toLowerCase().match(/(\d{1,2})\s*[h:]\s*(\d{2})?\s*(?:às|as|a|até|-|–)\s*(\d{1,2})\s*[h:]\s*(\d{2})?/);
      if (!m) return null;
      var ini = Number(m[1]) * 60 + Number(m[2] || 0), fim = Number(m[3]) * 60 + Number(m[4] || 0);
      return (fim > ini && fim <= 1440) ? [ini, fim] : null;
    }
    function semEspaco(h) { return String(h || '').replace(/\s/g, '').toLowerCase(); }
    // O slot cobre a turma naquele dia? (mesma regra de disp_situacao_turma)
    function cobre(slot, horarioTurma) {
      var a = intervalo(slot.horario), b = intervalo(horarioTurma);
      if (a && b) return a[0] <= b[0] && a[1] >= b[1];
      return semEspaco(slot.horario) === semEspaco(horarioTurma);
    }
    function baixarPlanilha() {
      var d = D.dados || {}, slots = d.slots || [], profs = d.professores || [];
      var btn = el('dp-xlsx'); btn.disabled = true;
      Promise.all([carregarLibXLSX(), api('turmas.listar', { semestre_id: D.prox.id }), api('cursos.listar', {})])
        .then(function(r) {
          var XLSX = r[0];
          var turmas = (r[1].sucesso && r[1].dados) ? r[1].dados : [];
          var cursos = {}; ((r[2].sucesso && r[2].dados) || []).forEach(function(c) { cursos[c.id] = c; });
          var nomeProf = {}; profs.forEach(function(p) { nomeProf[p.id] = p.nome; });
          var marcadosPor = {};   // professor_id → [slots]
          slots.forEach(function(s) { (s.professores || []).forEach(function(pid) { (marcadosPor[pid] = marcadosPor[pid] || []).push(s); }); });
          function rotSlot(s) { return DIA_CURTO[s.dia] + ' ' + s.horario + ' (' + s.turno + ')'; }

          // 1) Professores × horários (X = marcou)
          var cab1 = ['Professor', 'Mínimo', 'Mínimo no sábado', 'Marcados', 'Marcados no sábado', 'Situação', 'Última marcação']
            .concat(slots.map(rotSlot));
          var aba1 = [cab1].concat(profs.map(function(p) {
            var meus = marcadosPor[p.id] || [];
            return [p.nome, p.minimo, p.minimo_sabado || '', p.marcados, p.marcados_sabado || 0, situacao(p).txt,
                    p.ultima_marcacao ? fmtDH(p.ultima_marcacao) : '']
              .concat(slots.map(function(s) { return meus.indexOf(s) !== -1 ? 'X' : ''; }));
          }));

          // 2) Horários: quem marcou cada slot
          var aba2 = [['Dia', 'Horário', 'Turno', 'Nº de professores', 'Professores']].concat(slots.map(function(s) {
            var nomes = (s.professores || []).map(function(id) { return nomeProf[id] || '?'; })
              .sort(function(a, b) { return a.localeCompare(b, 'pt-BR'); });
            return [NOME_DIA[s.dia], s.horario, s.turno, nomes.length, nomes.join('; ')];
          }));

          // 3) Turmas do próximo semestre com os professores disponíveis
          var aba3 = [['Código', 'Curso', 'Estágio', 'Dias', 'Horário', 'Turno', 'Modalidade', 'Vagas',
                       'Professor atual', 'Professor atual está disponível?', 'Nº de disponíveis', 'Professores disponíveis']];
          turmas.slice().sort(function(a, b) { return String(a.external_id).localeCompare(String(b.external_id), 'pt-BR', { numeric: true }); })
            .forEach(function(t) {
              var dias = diasDe(t.dia_semana);
              var disp = profs.filter(function(p) {
                var meus = marcadosPor[p.id] || [];
                return dias.length && dias.every(function(dia) {
                  return meus.some(function(s) { return s.dia === dia && cobre(s, t.horario); });
                });
              }).map(function(p) { return p.nome; }).sort(function(a, b) { return a.localeCompare(b, 'pt-BR'); });
              var c = cursos[t.curso_id] || {};
              var atual = t.professor_id ? (nomeProf[t.professor_id] || (t.professor && t.professor.nome) || '') : '';
              var atualDisp = !t.professor_id ? '' : (disp.indexOf(atual) !== -1 ? 'Sim'
                : ((marcadosPor[t.professor_id] || []).length ? 'Não (fora do horário)' : 'Não marcou'));
              aba3.push([t.external_id, c.sigla || '', t.estagio || c.nome || '', dias.map(function(x) { return DIA_CURTO[x]; }).join(', '),
                         t.horario || '', t.turno || '', t.modalidade || '', t.vagas_totais == null ? '' : t.vagas_totais,
                         atual || 'a definir', atualDisp, disp.length, disp.join('; ')]);
            });

          var wb = XLSX.utils.book_new();
          function addAba(linhas, nome, larguras) {
            var ws = XLSX.utils.aoa_to_sheet(linhas);
            ws['!cols'] = larguras.map(function(w) { return { wch: w }; });
            if (linhas.length > 1) ws['!autofilter'] = { ref: XLSX.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: linhas.length - 1, c: linhas[0].length - 1 } }) };
            XLSX.utils.book_append_sheet(wb, ws, nome);
          }
          addAba(aba1, 'Professores x horários', [32, 8, 10, 9, 10, 22, 16].concat(slots.map(function() { return 14; })));
          addAba(aba2, 'Horários', [10, 16, 8, 10, 80]);
          addAba(aba3, 'Turmas ' + D.prox.rotulo, [16, 8, 24, 12, 16, 8, 12, 7, 30, 20, 10, 80]);
          var hoje = new Date().toLocaleDateString('pt-BR', { timeZone: 'America/Fortaleza' }).split('/').reverse().join('-');
          XLSX.writeFile(wb, 'disponibilidade-professores-' + D.prox.external_id + '-' + hoje + '.xlsx');
          aviso('Planilha baixada.');
        })
        .catch(function(e) { aviso((e && e.message) || 'Erro ao gerar a planilha.', 'error'); })
        .then(function() { btn.disabled = false; });
    }
    function atualizar() {

    }

    function renderLista() {
      var ts = E.turmas;
      var n = { aberta: 0, entregue: 0, concluida: 0 }, prontas = 0, sug = 0;

      el('en-resumo').innerHTML =
        '<div class="tt-resumo-item"><b>' + ts.length + '</b>turmas</div>' +
        '<div class="tt-resumo-item"><b>' + n.aberta + '</b>em aberto</div>' +
        '<div class="tt-resumo-item"><b>' + n.entregue + '</b>entregues</div>' +
        '<div class="tt-resumo-item"><b>' + prontas + '</b>prontas para concluir</div>' +
        '<div class="tt-resumo-item"><b>' + n.concluida + '</b>concluídas</div>' +
        '<div class="tt-resumo-item' + (sug ? ' alerta' : '') + '"><b>' + sug + '</b>sugestões pendentes</div>';
      el('en-lote').disabled = !prontas;
      var lista = ts.filter(function(t) {
        if (E.filtroIdioma && t.idioma_id !== E.filtroIdioma) return false;
        var f = E.filtroSit;
        if (f === 'pronta' && !pronta(t)) return false;
        if (f === 'pendencia' && !(t.sem_nota || t.aulas_sem_freq) ) return false;
        if (f === 'pendencia' && estado(t) === 'concluida') return false;
        if (f === 'sugestao' && !t.sugestoes_pendentes) return false;
        if (['aberta', 'entregue', 'concluida'].indexOf(f) !== -1 && estado(t) !== f) return false;
        if (E.busca && [t.codigo, t.estagio, t.curso_sigla, t.professor].join(' ').toLowerCase().indexOf(E.busca) === -1) return false;
        return true;
      });
      var corpo = el('en-corpo');
      if (!lista.length) { corpo.innerHTML = '<tr><td colspan="8"><div class="tt-vazio">Nenhuma turma com estes filtros.</div></td></tr>'; return; }
      corpo.innerHTML = lista.map(function(t) {
        var est = estado(t);
        var pend = est === 'concluida' ? '—' : [
          t.sem_nota ? '<span class="en-falta">' + t.sem_nota + ' sem nota</span>' : '',
          t.aulas_sem_freq ? '<span class="en-falta">' + t.aulas_sem_freq + ' aula(s) sem freq.</span>' : ''
        ].filter(Boolean).join('<br>') || '<span class="en-ok">completas</span>';
        var res = [['APROVADO', t.aprovados], ['RETIDO', t.retidos], ['RETIDO_FALTAS', t.retidos_faltas], ['PENDENTE', t.pendentes]]
          .filter(function(x) { return x[1]; }).map(function(x) { return '<span class="en-res ' + x[0] + '" title="' + NOME_RES[x[0]] + '">' + x[1] + '</span>'; }).join(' ');
        return '<tr data-id="' + esc(t.id) + '">' +
          '<td><span class="tt-cod">' + esc(t.codigo) + '</span><span class="tt-sub">' + esc(t.estagio || t.curso_sigla || '') + (t.situacao_turma === 'ENCERRADA' ? ' · turma encerrada' : '') + '</span></td>' +
          '<td>' + esc(t.professor || '—') + '</td>' +
          '<td>' + (t.ativos + t.concluidos) + '</td>' +
          '<td style="font-size:12px;">' + pend + '</td>' +
          '<td>' + (res || '—') + '</td>' +
          '<td>' + (t.sugestoes_pendentes ? '<span class="tt-adef">' + t.sugestoes_pendentes + ' pendente(s)</span>' : '—') + '</td>' +
          '<td><span class="en-est ' + est + '">' + NOME_EST[est] + '</span>' + (est !== 'aberta' ? '<span class="tt-sub">' + fmtD(est === 'concluida' ? t.concluida_em : t.entregue_em) + '</span>' : '') + '</td>' +
          '<td><button class="tt-btn" data-acao="abrir" style="height:30px;">Abrir</button></td></tr>';
      }).join('');
      corpo.querySelectorAll('button[data-acao="abrir"]').forEach(function(b) {
        b.addEventListener('click', function() { abrirTurma(b.closest('tr').dataset.id); });
      });
    }

    // ── Janela da turma ──────────────────────────────────────────────────
    function abrirTurma(id) {
      E.turma = id;
      el('en-t-titulo').textContent = 'Carregando…';
      el('en-t-corpo').innerHTML = '<div class="tr11-estado"><div class="spinner" style="margin:0 auto 10px;"></div></div>';
      el('en-t-acoes').innerHTML = '';
      el('en-m-turma').classList.add('show');
      api('enc.turma', { turma_id: id }).then(function(res) {
        if (!res.sucesso) { el('en-t-corpo').innerHTML = '<div class="tt-vazio">' + esc(res.mensagem) + '</div>'; return; }
        E.dadosTurma = res.dados; renderTurma();
      });
    }
    function aplicarRetorno(res, msgOk) {
      if (!res.sucesso) { aviso(res.mensagem, 'error'); return false; }
      E.dadosTurma = res.dados; renderTurma(); aviso(msgOk);
      atualizar();
      return true;
    }
    function renderTurma() {
      var d = E.dadosTurma, t = d.turma, est = estado(t), pend = d.pendencias || {};
      el('en-t-titulo').textContent = t.codigo + ' · ' + (t.estagio || (t.curso && t.curso.nome) || '') + ' · ' + (t.professor || 'sem professor');
      var aulas = pend.aulas_sem_frequencia || [];
      var info = '<p class="tt-aviso"><span class="en-est ' + est + '">' + NOME_EST[est] + '</span> ' +
        (est === 'concluida' ? 'em ' + fmtD(t.concluida_em) + (t.concluida_por ? ' por ' + esc(t.concluida_por) : '') + '. Matrículas concluídas com o resultado final; notas e frequência travadas.'
         : est === 'entregue' ? 'pelo professor em ' + fmtD(t.entregue_em) + (t.entregue_por ? ' (' + esc(t.entregue_por) + ')' : '') + '.'
         : 'O professor ainda não entregou.') +
        (est !== 'concluida' && (pend.alunos_sem_nota || aulas.length)
          ? ' <span class="en-falta">Pendências: ' + [pend.alunos_sem_nota ? pend.alunos_sem_nota + ' aluno(s) sem nota' : '',
               aulas.length ? 'frequência faltando em ' + aulas.map(function(a) { return a.data.split('-').reverse().slice(0, 2).join('/'); }).join(', ') : ''].filter(Boolean).join('; ') + '.</span>' : '') +
        ' Data de corte da idade: <b>' + (d.data_corte ? d.data_corte.split('-').reverse().join('/') : '—') + '</b>.</p>';
      var linhas = (d.alunos || []).map(function(a) {
        var comps = (a.componentes || []).map(function(c) {
          return '<span class="en-comp ' + c.situacao + '">' + esc(c.componente) + ' ' + (c.media == null ? '—' : String(c.media).replace('.', ',')) + '</span>';
        }).join(' ');
        var f = a.frequencia || {};
        var dest;
        if (a.destino) dest = '<b>' + esc(a.destino.curso ? a.destino.curso.sigla : 'Sem destino') + '</b><span class="tt-sub">' + esc(NOME_TIPO[a.destino.tipo] || '') + (a.destino.bypass_idade ? ' · idade ignorada' : '') + (a.destino.motivo ? ' — ' + esc(a.destino.motivo) : '') + '</span>';
        else if (a.desistente) dest = '<span class="en-falta">Desistente</span><span class="tt-sub">retido por faltas (frequência abaixo de 75%)</span>';
        else dest = esc(a.destino_padrao ? a.destino_padrao.sigla : '—') + '<span class="tt-sub">' + (a.destino_padrao ? esc(a.destino_padrao.nome) + ' · ' : '') + 'pelo resultado' + (a.resultado === 'PENDENTE' ? ' (provisório)' : '') + '</span>';
        if (a.aviso_idade) dest += '<span class="tt-sub en-falta" title="' + esc(a.aviso_idade) + '">⚠ ' + esc(a.aviso_idade) + '</span>';
        var sg = a.sugestao, sug = '—';
        if (sg) {
          sug = '<b>' + (sg.tipo === 'democao' ? 'Demoção' : 'Promoção') + ' → ' + esc(sg.curso ? sg.curso.sigla : '') + '</b>' +
            '<span class="tt-sub">' + esc(sg.sugerido_por || '') + ': ' + esc(sg.motivo || '') + '</span>' +
            (sg.status === 'pendente' && est !== 'concluida'
              ? '<span style="display:flex;gap:4px;margin-top:4px;"><button class="tt-btn" data-acao="aprovar" style="height:28px;">Aprovar</button><button class="tt-btn perigo" data-acao="recusar" style="height:28px;">Recusar</button></span>'
              : '<span class="tt-sub">' + (sg.status === 'aprovada' ? '✓ aprovada' : '✕ recusada') + (sg.decisao_motivo ? ' — ' + esc(sg.decisao_motivo) : '') + '</span>');
        }
        return '<tr data-mat="' + esc(a.matricula_id) + '">' +
          '<td>' + esc(a.aluno) + '<span class="tt-sub">' + esc(a.matricula || '') + (a.situacao === 'CONCLUIDA' ? ' · concluída' : '') + '</span></td>' +
          '<td>' + (f.pct == null ? '—' : f.pct + '%') + '<span class="tt-sub">' + (f.f || 0) + ' falta(s)' + (f.sem_registro && a.situacao === 'ATIVA' ? ' · <span class="en-falta">' + f.sem_registro + ' sem registro</span>' : '') + '</span></td>' +
          '<td>' + (comps || '—') + '</td>' +
          '<td><span class="en-res ' + esc(a.resultado) + '">' + esc(NOME_RES[a.resultado] || a.resultado) + '</span></td>' +
          '<td>' + dest + '</td>' +
          '<td>' + sug + '</td>' +
          '<td><button class="tt-ico" data-acao="destino" title="Alterar destino"><span class="material-icons-round">alt_route</span></button></td></tr>';
      }).join('');
      el('en-t-corpo').innerHTML = info +
        '<div class="tt-tabela-wrap"><table class="tt-tabela"><thead><tr><th>Aluno</th><th>Frequência</th><th>Médias</th><th>Resultado</th><th>Destino no próximo semestre</th><th>Sugestão do professor</th><th></th></tr></thead><tbody>' +
        (linhas || '<tr><td colspan="7"><div class="tt-vazio">Nenhum aluno ativo ou concluído.</div></td></tr>') + '</tbody></table></div>';
      el('en-t-corpo').querySelectorAll('button[data-acao]').forEach(function(b) {
        b.addEventListener('click', function() {
          var mat = b.closest('tr').dataset.mat;
          var a = (E.dadosTurma.alunos || []).filter(function(x) { return x.matricula_id === mat; })[0]; if (!a) return;
          if (b.dataset.acao === 'destino') abrirDestino(a);
          if (b.dataset.acao === 'aprovar') aprovarSugestao(a);
          if (b.dataset.acao === 'recusar') recusarSugestao(a);

      });
      var acoes = '<button class="tt-btn" data-efechar2="1">Fechar</button>';
      if (est === 'entregue') acoes = '<button class="tt-btn" id="en-devolver"><span class="material-icons-round">undo</span>Devolver ao professor</button>' + acoes;
      if (est === 'concluida') acoes = '<button class="tt-btn perigo" id="en-reabrir"><span class="material-icons-round">lock_open</span>Reabrir turma</button>' + acoes;
      else acoes += '<button class="tt-btn prim" id="en-concluir"><span class="material-icons-round">verified</span>Concluir turma</button>';
      el('en-t-acoes').innerHTML = acoes;
