<!--
  F5_Matriculas.html
  Listagem de matrículas com busca por nome/ID e filtros por situação e turma.
-->
<style>
  .m5-toolbar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
  .m5-busca-wrap{flex:1;min-width:200px;position:relative;}
  .m5-busca-wrap .material-icons-round{position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:18px;color:var(--c-text-3,#9898B0);pointer-events:none;}
  .m5-busca{width:100%;height:38px;border:1.5px solid var(--c-border,#E8E7E2);border-radius:8px;padding:0 12px 0 36px;font-family:var(--font-sans,sans-serif);font-size:13.5px;color:var(--c-text-1,#1A1A2E);background:#fff;outline:none;transition:border-color 150ms ease;}
  .m5-busca:focus{border-color:#E63946;box-shadow:0 0 0 3px rgba(230,57,70,0.09);}
  .m5-busca::placeholder{color:var(--c-text-3,#9898B0);}
  .m5-select{height:38px;border:1.5px solid var(--c-border,#E8E7E2);border-radius:8px;padding:0 11px;font-family:var(--font-sans,sans-serif);font-size:13px;color:var(--c-text-1,#1A1A2E);background:#fff;outline:none;cursor:pointer;max-width:200px;}
  .m5-select:focus{border-color:#E63946;}

  .m5-card{background:#fff;border:1px solid var(--c-border,#E8E7E2);border-radius:10px;overflow:hidden;}
  .m5-tabela{width:100%;border-collapse:collapse;font-size:13.5px;}
  .m5-tabela thead tr{background:#F8F7F3;border-bottom:1px solid var(--c-border,#E8E7E2);}
  .m5-tabela th{padding:10px 16px;font-size:11px;font-weight:600;letter-spacing:0.6px;text-transform:uppercase;color:var(--c-text-3,#9898B0);text-align:left;white-space:nowrap;}
  .m5-tabela tbody tr{border-bottom:1px solid var(--c-border,#E8E7E2);transition:background 120ms ease;}
  .m5-tabela tbody tr:last-child{border-bottom:none;}
  .m5-tabela tbody tr:hover{background:#FAFAF8;}
  .m5-tabela td{padding:11px 16px;color:var(--c-text-1,#1A1A2E);vertical-align:middle;}
  .m5-mat-id{font-family:var(--font-mono,monospace);font-size:11.5px;color:var(--c-text-3,#9898B0);}
  .m5-nome{font-weight:500;}
  .m5-turma-id{font-family:var(--font-mono,monospace);font-size:12px;}
  .badge-m5{display:inline-flex;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:600;}
  .badge-m5.ATIVA{background:rgba(42,157,143,0.12);color:#1A6E65;}
  .badge-m5.CANCELADA{background:rgba(230,57,70,0.10);color:#A32D2D;}
  .badge-m5.TRANCADA{background:rgba(233,196,106,0.20);color:#5C4200;}
  .badge-m5.CONCLUIDA{background:rgba(69,123,157,0.12);color:#185FA5;}
  .m5-acoes{display:flex;gap:6px;justify-content:flex-end;}
  .btn-m5-acao{height:28px;padding:0 10px;border-radius:6px;font-size:12px;font-weight:500;cursor:pointer;border:1.5px solid var(--c-border,#E8E7E2);background:#fff;color:var(--c-text-2,#5C5C7A);font-family:var(--font-sans,sans-serif);display:inline-flex;align-items:center;gap:4px;transition:background 120ms ease;}
  .btn-m5-acao:hover{background:#F5F4F0;}
  .btn-m5-acao .material-icons-round{font-size:14px;}

  .m5-estado{padding:48px 24px;text-align:center;color:var(--c-text-3,#9898B0);font-size:13.5px;}
  .m5-estado .material-icons-round{font-size:36px;display:block;margin:0 auto 10px;}
  .m5-spinner{width:24px;height:24px;border:2.5px solid var(--c-border,#E8E7E2);border-top-color:#E63946;border-radius:50%;animation:spin-m5 0.7s linear infinite;margin:0 auto 10px;}
  @keyframes spin-m5{to{transform:rotate(360deg);}}

  .m5-paginacao{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-top:1px solid var(--c-border,#E8E7E2);font-size:12.5px;color:var(--c-text-2,#5C5C7A);flex-wrap:wrap;gap:8px;}
  .m5-pag-btns{display:flex;gap:4px;}
  .btn-m5-pag{width:30px;height:30px;border-radius:6px;border:1.5px solid var(--c-border,#E8E7E2);background:#fff;font-size:12px;font-family:var(--font-sans,sans-serif);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background 120ms ease;color:var(--c-text-1,#1A1A2E);}
  .btn-m5-pag:hover:not(:disabled){background:#F5F4F0;}
  .btn-m5-pag:disabled{opacity:0.4;cursor:not-allowed;}
  .btn-m5-pag.ativa{background:#E63946;border-color:#E63946;color:#fff;}
  .btn-m5-pag .material-icons-round{font-size:16px;}

  /* Modal situação */
  .m5-modal-overlay{position:fixed;inset:0;background:rgba(26,26,46,0.45);z-index:200;display:flex;align-items:center;justify-content:center;padding:24px;backdrop-filter:blur(2px);}
  .m5-modal{background:#fff;border-radius:12px;width:100%;max-width:360px;box-shadow:0 12px 48px rgba(26,26,46,0.18);animation:modal-in-m5 200ms cubic-bezier(0.34,1.3,0.64,1);overflow:hidden;}
  @keyframes modal-in-m5{from{opacity:0;transform:scale(0.95);}to{opacity:1;transform:scale(1);}}
  .m5-modal-header{padding:16px 18px;border-bottom:1px solid var(--c-border,#E8E7E2);font-size:14px;font-weight:600;color:var(--c-text-1,#1A1A2E);}
  .m5-modal-corpo{padding:16px 18px;}
  .m5-modal-corpo p{font-size:13px;color:var(--c-text-2,#5C5C7A);margin-bottom:14px;}
  .m5-sit-opcoes{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .m5-sit-opcao{padding:10px 12px;border-radius:8px;border:1.5px solid var(--c-border,#E8E7E2);background:#fff;cursor:pointer;text-align:center;font-size:13px;font-weight:500;font-family:var(--font-sans,sans-serif);transition:border-color 150ms ease,background 150ms ease;color:var(--c-text-1,#1A1A2E);}
  .m5-sit-opcao:hover{border-color:#C8C7C2;background:#FAFAF8;}
  .m5-sit-opcao.ATIVA{border-color:#2A9D8F;color:#1A6E65;background:rgba(42,157,143,0.06);}
  .m5-sit-opcao.CANCELADA{border-color:#E63946;color:#A32D2D;background:rgba(230,57,70,0.06);}
  .m5-sit-opcao.TRANCADA{border-color:#D4A843;color:#5C4200;background:rgba(233,196,106,0.10);}
  .m5-sit-opcao.CONCLUIDA{border-color:#457B9D;color:#185FA5;background:rgba(69,123,157,0.06);}
  .m5-modal-footer{padding:12px 18px;border-top:1px solid var(--c-border,#E8E7E2);display:flex;justify-content:flex-end;}
  .btn-cancelar-m5{height:36px;padding:0 16px;border-radius:7px;border:1.5px solid var(--c-border,#E8E7E2);background:#fff;font-family:var(--font-sans,sans-serif);font-size:13px;cursor:pointer;color:var(--c-text-1,#1A1A2E);}
  .btn-cancelar-m5:hover{background:#F5F4F0;}

  /* Nova matrícula */
  .btn-m5-nova{height:38px;padding:0 14px;border-radius:8px;font-family:var(--font-sans,sans-serif);font-size:13px;font-weight:500;cursor:pointer;border:none;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;background:#E63946;color:#fff;transition:background 150ms ease,box-shadow 150ms ease;}
  .btn-m5-nova:hover{background:#C1121F;box-shadow:0 3px 10px rgba(230,57,70,0.25);}
  .btn-m5-nova .material-icons-round{font-size:18px;}

  .m5-nova-modal{max-width:440px;}
  .m5-nova-field{margin-bottom:14px;position:relative;}
  .m5-nova-field label{display:block;font-size:11px;font-weight:600;letter-spacing:0.5px;text-transform:uppercase;color:var(--c-text-3,#9898B0);margin-bottom:6px;}
  .m5-nova-input,.m5-nova-select{width:100%;height:38px;border:1.5px solid var(--c-border,#E8E7E2);border-radius:7px;padding:0 11px;font-family:var(--font-sans,sans-serif);font-size:13.5px;color:var(--c-text-1,#1A1A2E);background:#FAFAF8;outline:none;transition:border-color 150ms ease;box-sizing:border-box;}
  .m5-nova-input:focus,.m5-nova-select:focus{border-color:#E63946;background:#fff;}
  .m5-nova-select{cursor:pointer;}
  .m5-aluno-dropdown{position:absolute;top:100%;left:0;right:0;background:#fff;border:1.5px solid var(--c-border,#E8E7E2);border-top:none;border-radius:0 0 7px 7px;max-height:220px;overflow-y:auto;z-index:50;box-shadow:0 6px 16px rgba(26,26,46,0.10);display:none;}
  .m5-aluno-dropdown.show{display:block;}
  .m5-aluno-item{padding:9px 12px;cursor:pointer;font-size:13px;transition:background 100ms ease;border-bottom:1px solid #F0EEE8;}
  .m5-aluno-item:last-child{border-bottom:none;}
  .m5-aluno-item:hover,.m5-aluno-item.ativo{background:#F5F4F0;}
  .m5-aluno-item .m5-ai-nome{font-weight:500;color:var(--c-text-1,#1A1A2E);}
  .m5-aluno-item .m5-ai-id{font-size:11px;font-family:var(--font-mono,monospace);color:var(--c-text-3,#9898B0);margin-left:6px;}
  .m5-aluno-item.vazio{color:var(--c-text-3,#9898B0);cursor:default;}
  .m5-aluno-item.vazio:hover{background:none;}
  .m5-aluno-selecionado{display:none;align-items:center;justify-content:space-between;gap:8px;margin-top:6px;padding:7px 10px;background:rgba(42,157,143,0.07);border:1px solid rgba(42,157,143,0.25);border-radius:6px;font-size:12.5px;color:#1A6E65;}
  .m5-aluno-selecionado.show{display:flex;}
  .m5-aluno-selecionado button{border:none;background:none;cursor:pointer;color:#1A6E65;display:flex;align-items:center;}
  .m5-aluno-selecionado button .material-icons-round{font-size:16px;}
  .m5-nova-alerta{border-radius:8px;padding:10px 14px;font-size:13px;display:none;align-items:center;gap:8px;margin-bottom:14px;}
  .m5-nova-alerta.show{display:flex;}
  .m5-nova-alerta.erro{background:rgba(230,57,70,0.08);border:1px solid rgba(230,57,70,0.20);color:#B01020;}
  .m5-nova-aviso-vaga{font-size:12.5px;color:#A32D2D;background:rgba(230,57,70,0.07);border:1px solid rgba(230,57,70,0.18);border-radius:6px;padding:10px 12px;margin-top:4px;display:none;}
  .m5-nova-aviso-vaga.show{display:block;}
  .m5-nova-aviso-vaga .acoes{display:flex;gap:8px;margin-top:10px;}
  .btn-m5-forcar{height:32px;padding:0 12px;border-radius:6px;font-size:12.5px;font-weight:500;cursor:pointer;border:1.5px solid #E63946;background:#fff;color:#A32D2D;font-family:var(--font-sans,sans-serif);}
  .btn-m5-forcar:hover{background:rgba(230,57,70,0.08);}
  .btn-m5-forcar-cancelar{height:32px;padding:0 12px;border-radius:6px;font-size:12.5px;cursor:pointer;border:1.5px solid var(--c-border,#E8E7E2);background:#fff;color:var(--c-text-2,#5C5C7A);font-family:var(--font-sans,sans-serif);}
  .btn-m5-forcar-cancelar:hover{background:#F5F4F0;}
  .btn-m5-modal-primario{height:38px;padding:0 18px;border-radius:8px;background:#E63946;color:#fff;border:none;font-family:var(--font-sans,sans-serif);font-size:13.5px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:background 150ms ease;}
  .btn-m5-modal-primario:hover:not(:disabled){background:#C1121F;}
  .btn-m5-modal-primario:disabled{opacity:0.55;cursor:not-allowed;}
  .btn-m5-modal-primario .spinner-btn{width:15px;height:15px;border:2px solid rgba(255,255,255,0.35);border-top-color:#fff;border-radius:50%;animation:spin-m5 0.7s linear infinite;display:none;}
  .btn-m5-modal-primario.loading .spinner-btn{display:block;}
  .btn-m5-modal-primario.loading .btn-txt{display:none;}

  /* Resumo por situação */
  .m5-resumo{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
  .m5-resumo-item{background:#fff;border:1px solid var(--c-border,#E8E7E2);border-radius:8px;padding:10px 16px;font-size:12px;color:var(--c-text-2,#5C5C7A);display:flex;flex-direction:column;gap:2px;cursor:pointer;transition:border-color 150ms ease;}
  .m5-resumo-item:hover{border-color:#C8C7C2;}
  .m5-resumo-item.sel{border-color:#E63946;}
  .m5-resumo-num{font-size:20px;font-weight:700;color:var(--c-text-1,#1A1A2E);line-height:1;}
  .m5-resumo-num.ATIVA{color:#2A9D8F;}
  .m5-resumo-num.CANCELADA{color:#E63946;}
  .m5-resumo-num.TRANCADA{color:#D4A843;}
  .m5-resumo-num.CONCLUIDA{color:#457B9D;}
</style>

<div>
  <!-- Resumo -->
  <div class="m5-resumo" id="m5-resumo">
    <div class="m5-resumo-item sel" data-sit="">
      <span class="m5-resumo-num" id="cnt-todas">—</span>
      <span>Todas</span>
    </div>
    <div class="m5-resumo-item" data-sit="ATIVA">
      <span class="m5-resumo-num ATIVA" id="cnt-ativas">—</span>
      <span>Ativas</span>
    </div>
    <div class="m5-resumo-item" data-sit="TRANCADA">
      <span class="m5-resumo-num TRANCADA" id="cnt-trancadas">—</span>
      <span>Trancadas</span>
    </div>
    <div class="m5-resumo-item" data-sit="CONCLUIDA">
      <span class="m5-resumo-num CONCLUIDA" id="cnt-concluidas">—</span>
      <span>Concluídas</span>
    </div>
    <div class="m5-resumo-item" data-sit="CANCELADA">
      <span class="m5-resumo-num CANCELADA" id="cnt-canceladas">—</span>
      <span>Canceladas</span>
    </div>
  </div>

  <!-- Toolbar -->
  <div class="m5-toolbar">
    <div class="m5-busca-wrap">
      <span class="material-icons-round">search</span>
      <input type="text" class="m5-busca" id="m5-busca"
             placeholder="Buscar por nome do aluno, MatriculaID ou TurmaID…">
    </div>
    <select class="m5-select" id="m5-filtro-sit">
      <option value="">Todas as situações</option>
      <option value="ATIVA">Ativas</option>
      <option value="TRANCADA">Trancadas</option>
      <option value="CONCLUIDA">Concluídas</option>
      <option value="CANCELADA">Canceladas</option>
    </select>
    <select class="m5-select" id="m5-filtro-turma">
      <option value="">Todas as turmas</option>
    </select>
    <button class="btn-m5-nova" id="btn-m5-nova-matricula" style="display:none;">
      <span class="material-icons-round">person_add</span>Nova matrícula
    </button>
  </div>

  <!-- Tabela -->
  <div class="m5-card">
    <div id="m5-estado" class="m5-estado">
      <div class="m5-spinner"></div><p>Carregando matrículas…</p>
    </div>
    <table class="m5-tabela" id="m5-tabela" style="display:none;">
      <thead>
        <tr>
          <th>MatriculaID</th>
          <th>Aluno</th>
          <th>TurmaID</th>
          <th>Estágio</th>
          <th>Situação</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="m5-tbody"></tbody>
    </table>
    <div class="m5-paginacao" id="m5-paginacao" style="display:none;">
      <span id="m5-pag-info">—</span>
      <div class="m5-pag-btns" id="m5-pag-btns"></div>
    </div>
  </div>
</div>

<!-- Modal situação -->
<div class="m5-modal-overlay" id="m5-modal-sit" style="display:none;">
  <div class="m5-modal">
    <div class="m5-modal-header">Alterar situação da matrícula</div>
    <div class="m5-modal-corpo">
      <p id="m5-sit-aluno">Selecione a nova situação:</p>
      <div class="m5-sit-opcoes" id="m5-sit-opcoes">
        <button class="m5-sit-opcao ATIVA"     data-sit="ATIVA">✓ Ativa</button>
        <button class="m5-sit-opcao TRANCADA"  data-sit="TRANCADA">⏸ Trancada</button>
        <button class="m5-sit-opcao CONCLUIDA" data-sit="CONCLUIDA">🎓 Concluída</button>
        <button class="m5-sit-opcao CANCELADA" data-sit="CANCELADA">✕ Cancelada</button>
      </div>
      <!-- Campo de motivo — exibido apenas ao selecionar "Cancelada" -->
      <div id="m5-motivo-wrap" style="display:none;margin-top:14px;">
        <label style="display:block;font-size:11px;font-weight:600;letter-spacing:0.5px;text-transform:uppercase;color:var(--c-text-3,#9898B0);margin-bottom:6px;">
          Motivo do cancelamento <span style="color:#E63946;">*</span>
        </label>
        <textarea id="m5-motivo-texto" rows="3" placeholder="Descreva o motivo do cancelamento…"
          style="width:100%;border:1.5px solid var(--c-border,#E8E7E2);border-radius:7px;padding:8px 10px;font-family:var(--font-sans,sans-serif);font-size:13px;color:var(--c-text-1,#1A1A2E);background:#FAFAF8;outline:none;resize:vertical;box-sizing:border-box;"></textarea>
        <div id="m5-motivo-erro" style="display:none;color:#E63946;font-size:11.5px;margin-top:4px;">Informe o motivo do cancelamento.</div>
        <div style="display:flex;gap:8px;margin-top:12px;">
          <button class="btn-cancelar-m5" id="btn-m5-motivo-voltar">Voltar</button>
          <button class="m5-sit-opcao CANCELADA" id="btn-m5-confirmar-cancelamento" style="flex:1;">Confirmar cancelamento</button>
        </div>
      </div>
    </div>
    <div class="m5-modal-footer">
      <button class="btn-cancelar-m5" id="btn-cancelar-m5-sit">Cancelar</button>
    </div>
  </div>
</div>

<!-- Modal: nova matrícula -->
<div class="m5-modal-overlay" id="m5-modal-nova" style="display:none;">
  <div class="m5-modal m5-nova-modal">
    <div class="m5-modal-header">Nova matrícula</div>
    <div class="m5-modal-corpo">
      <div class="m5-nova-alerta erro" id="m5-nova-alerta">
        <span class="material-icons-round">error_outline</span>
        <span id="m5-nova-alerta-msg"></span>
      </div>

      <div class="m5-nova-field">
        <label>Aluno <span style="color:#E63946;">*</span></label>
        <input type="text" class="m5-nova-input" id="m5-nova-aluno-busca"
               placeholder="Digite o nome ou o AlunoID (ex: A261.0001)…" autocomplete="off">
        <div class="m5-aluno-dropdown" id="m5-nova-aluno-dropdown"></div>
        <div class="m5-aluno-selecionado" id="m5-nova-aluno-selecionado">
          <span id="m5-nova-aluno-selecionado-txt"></span>
          <button type="button" id="m5-nova-aluno-limpar" title="Trocar aluno">
            <span class="material-icons-round">close</span>
          </button>
        </div>
      </div>

      <div class="m5-nova-field">
        <label>Turma <span style="color:#E63946;">*</span></label>
        <select class="m5-nova-select" id="m5-nova-turma">
          <option value="">Selecione uma turma…</option>
        </select>
      </div>

      <div class="m5-nova-aviso-vaga" id="m5-nova-aviso-vaga">
        <span id="m5-nova-aviso-vaga-msg"></span>
        <div class="acoes">
          <button class="btn-m5-forcar-cancelar" id="btn-m5-forcar-cancelar" type="button">Cancelar</button>
          <button class="btn-m5-forcar" id="btn-m5-forcar-confirmar" type="button">Matricular mesmo assim</button>
        </div>
      </div>
    </div>
    <div class="m5-modal-footer" style="justify-content:space-between;">
      <button class="btn-cancelar-m5" id="btn-m5-nova-cancelar">Cancelar</button>
      <button class="btn-m5-modal-primario" id="btn-m5-nova-salvar">
        <div class="spinner-btn"></div>
        <span class="material-icons-round btn-txt" style="font-size:16px;">person_add</span>
        <span class="btn-txt">Matricular</span>
      </button>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';


  var state = {
    matriculas: [], turmas: [],
    paginaAtual: 1, tamanhoPagina: 25,
    totalRegistros: 0, totalPaginas: 1,
    busca: '', filtroSit: '', filtroTurma: '',
    matriculaParaSit: null,
    papel: '', podeEditar: false, podeForcarVaga: false,
    // Estado do modal "Nova matrícula"
    novaAlunoSel: null,     // { AlunoID, NomeExibicao } escolhido no combobox
    novaForcarVaga: false,  // true após o usuário confirmar "matricular mesmo assim"
  };

  var buscarTimer = null;
  var buscaAlunoTimer = null;

  // =========================================================
  // postApi — usa api.js carregado pelo index.html
  // =========================================================
  function postApi(acao, dados) {
    return window.postApi(acao, dados);
  }

  function el(id) { return document.getElementById(id); }

  // =========================================================
  // INIT
  // =========================================================
  function init() {
    var usuario = (typeof App !== 'undefined' && App.usuario) ? App.usuario : null;
    if (usuario) {
      state.papel         = usuario.Papel || '';
      state.podeEditar    = ['admin','coordenacao','secretaria'].indexOf(state.papel) !== -1;
      state.podeForcarVaga= ['admin','coordenacao'].indexOf(state.papel) !== -1;
    }
    if (state.podeEditar && el('btn-m5-nova-matricula')) {
      el('btn-m5-nova-matricula').style.display = 'inline-flex';
    }
    registrarEventos();
    carregarTurmasParaFiltro();
    carregarMatriculas();
  }

  // =========================================================
  // FILTRO DE TURMAS
  // =========================================================
  function carregarTurmasParaFiltro() {
    postApi('turmas.listar', { tamanhoPagina: 300 })
      .then(function(res) {
        if (!res.sucesso || !res.dados) return;
        state.turmas = res.dados.dados || [];

        var sel = el('m5-filtro-turma');
        state.turmas.forEach(function(t) {
          var opt = document.createElement('option');
          opt.value = t.TurmaID;
          opt.textContent = t.TurmaID + ' — ' + (t.Estagio || t.CursoID || '');
          sel.appendChild(opt);
        });

        // Popula também o select de turma do modal "Nova matrícula"
        var selNova = el('m5-nova-turma');
        if (selNova) {
          state.turmas.forEach(function(t) {
            if (String(t.SituacaoTurma) === 'ENCERRADA') return; // não oferece turmas encerradas
            var opt2 = document.createElement('option');
            opt2.value = t.TurmaID;
            opt2.textContent = t.TurmaID + ' — ' + (t.Estagio || t.CursoID || '') +
              (t.DiaSemana ? ' · ' + t.DiaSemana : '') + (t.Horario ? ' ' + t.Horario : '');
            selNova.appendChild(opt2);
          });
        }
      })
      .catch(function() {});
  }

  // =========================================================
  // MATRÍCULAS
  // =========================================================
  function carregarMatriculas() {
    el('m5-estado').style.display = 'block';
    el('m5-estado').innerHTML = '<div class="m5-spinner"></div><p>Carregando matrículas…</p>';
    el('m5-tabela').style.display = 'none';
    el('m5-paginacao').style.display = 'none';

    var filtros = {
      pagina:        state.paginaAtual,
      tamanhoPagina: state.tamanhoPagina,
    };
    if (state.filtroSit)   filtros.situacao = state.filtroSit;
    if (state.filtroTurma) filtros.turmaId  = state.filtroTurma;
    if (state.busca)       filtros.busca    = state.busca;

    postApi('matriculas.listar', filtros)
      .then(function(res) {
        if (!res.sucesso) {
          el('m5-estado').style.display = 'block';
          el('m5-estado').innerHTML = '<span class="material-icons-round">error_outline</span><p>' + (res.mensagem||'Erro ao carregar.') + '</p>';
          return;
        }
        var dados = res.dados || {};
        state.matriculas      = dados.dados || [];
        state.totalRegistros  = dados.totalRegistros || state.matriculas.length;
        state.totalPaginas    = dados.totalPaginas   || 1;
        atualizarResumo();
        renderizarMatriculas();
      })
      .catch(function(e) {
        el('m5-estado').style.display = 'block';
        el('m5-estado').innerHTML = '<span class="material-icons-round">error_outline</span><p>Erro de comunicação: ' + (e.message||'') + '</p>';
      });
  }

  function atualizarResumo() {
    // Busca contagens por situação (todos os registros sem filtro de situação)
    postApi('matriculas.listar', { tamanhoPagina: 5000 })
      .then(function(res) {
        if (!res.sucesso || !res.dados) return;
        var todas = res.dados.dados || [];
        var contar = function(sit) {
          return todas.filter(function(m) { return m.SituacaoMatricula === sit; }).length;
        };
        el('cnt-todas').textContent     = todas.length;
        el('cnt-ativas').textContent    = contar('ATIVA');
        el('cnt-trancadas').textContent = contar('TRANCADA');
        el('cnt-concluidas').textContent= contar('CONCLUIDA');
        el('cnt-canceladas').textContent= contar('CANCELADA');
      })
      .catch(function() {});
  }

  function matriculasFiltradas() {
    var busca = state.busca.toLowerCase();
    if (!busca) return state.matriculas;
    return state.matriculas.filter(function(m) {
      return (m.MatriculaID||'').toLowerCase().indexOf(busca) !== -1 ||
             (m.AlunoID||'').toLowerCase().indexOf(busca) !== -1 ||
             (m.NomeExibicao||'').toLowerCase().indexOf(busca) !== -1 ||
             (m.TurmaID||'').toLowerCase().indexOf(busca) !== -1;
    });
  }

  function badgeSituacao(m) {
    var sit = m.SituacaoMatricula || 'ATIVA';
    if (sit === 'CANCELADA' && (m.MotivoCancelamento || m.DataCancelamento)) {
      var titulo = 'Cancelada em ' + (m.DataCancelamento || '—') +
        (m.MotivoCancelamento ? '\nMotivo: ' + m.MotivoCancelamento : '') +
        (m.CanceladoPor ? '\nPor: ' + m.CanceladoPor : '');
      return '<span class="badge-m5 ' + sit + '" title="' + titulo.replace(/"/g, '&quot;') + '" style="cursor:help;border-bottom:1px dotted currentColor;">' + sit + '</span>';
    }
    return '<span class="badge-m5 ' + sit + '">' + sit + '</span>';
  }

  function renderizarMatriculas() {
    var lista = matriculasFiltradas();

    if (lista.length === 0) {
      el('m5-estado').style.display = 'block';
      el('m5-estado').innerHTML = '<span class="material-icons-round">assignment</span><p>Nenhuma matrícula encontrada.</p>';
      el('m5-tabela').style.display = 'none';
      el('m5-paginacao').style.display = 'none';
      return;
    }

    el('m5-estado').style.display = 'none';
    el('m5-tabela').style.display = 'table';

    var tbody = el('m5-tbody'); tbody.innerHTML = '';

    lista.forEach(function(m) {
      var sit = m.SituacaoMatricula || 'ATIVA';
      var tr = document.createElement('tr');
      tr.innerHTML =
        '<td class="m5-mat-id">' + (m.MatriculaID||'—') + '</td>' +
        '<td><div class="m5-nome">' + (m.NomeExibicao || m.AlunoID || '—') + '</div>' +
            '<div style="font-size:11.5px;color:var(--c-text-3);">' + (m.AlunoID||'') + '</div></td>' +
        '<td class="m5-turma-id">' + (m.TurmaID||'—') + '</td>' +
        '<td style="font-size:13px;">' + (m.Estagio || '—') + '</td>' +
        '<td>' + badgeSituacao(m) + '</td>' +
        '<td>' +
          (state.podeEditar ?
            '<div class="m5-acoes">' +
              '<button class="btn-m5-acao" data-mat="' + m.MatriculaID + '">' +
                '<span class="material-icons-round">swap_horiz</span>Situação' +
              '</button>' +
            '</div>' : '') +
        '</td>';

      var btn = tr.querySelector('.btn-m5-acao');
      if (btn) {
        btn.addEventListener('click', function() {
          state.matriculaParaSit = m;
          el('m5-sit-aluno').textContent = 'Aluno: ' + (m.NomeExibicao || m.AlunoID || m.MatriculaID);
          resetarModalSitM5();
          el('m5-modal-sit').style.display = 'flex';
        });
      }

      tbody.appendChild(tr);
    });

    renderizarPaginacao();
  }

  function renderizarPaginacao() {
    var pag = el('m5-paginacao'); pag.style.display = 'flex';
    var ini = (state.paginaAtual - 1) * state.tamanhoPagina + 1;
    var fim = Math.min(state.paginaAtual * state.tamanhoPagina, state.totalRegistros);
    el('m5-pag-info').textContent = ini + '–' + fim + ' de ' + state.totalRegistros + ' matrícula(s)';

    var btns = el('m5-pag-btns'); btns.innerHTML = '';

    var prev = document.createElement('button'); prev.className = 'btn-m5-pag';
    prev.innerHTML = '<span class="material-icons-round">chevron_left</span>';
    prev.disabled = state.paginaAtual <= 1;
    prev.addEventListener('click', function() { if (state.paginaAtual > 1) { state.paginaAtual--; carregarMatriculas(); } });
    btns.appendChild(prev);

    var ini2 = Math.max(1, state.paginaAtual - 2);
    var fim2  = Math.min(state.totalPaginas, ini2 + 4);
    for (var i = ini2; i <= fim2; i++) {
      (function(pg) {
        var b = document.createElement('button');
        b.className = 'btn-m5-pag' + (pg === state.paginaAtual ? ' ativa' : '');
        b.textContent = pg;
        b.addEventListener('click', function() { state.paginaAtual = pg; carregarMatriculas(); });
        btns.appendChild(b);
      })(i);
    }

    var next = document.createElement('button'); next.className = 'btn-m5-pag';
    next.innerHTML = '<span class="material-icons-round">chevron_right</span>';
    next.disabled = state.paginaAtual >= state.totalPaginas;
    next.addEventListener('click', function() { if (state.paginaAtual < state.totalPaginas) { state.paginaAtual++; carregarMatriculas(); } });
    btns.appendChild(next);
  }

  function fecharModalSitM5() {
    el('m5-modal-sit').style.display = 'none';
    resetarModalSitM5();
  }

  function resetarModalSitM5() {
    el('m5-sit-opcoes').style.display = 'grid';
    el('m5-motivo-wrap').style.display = 'none';
    el('m5-motivo-texto').value = '';
    el('m5-motivo-erro').style.display = 'none';
  }

  function alterarSituacao(novaSit, motivo) {
    if (!state.matriculaParaSit) return;
    el('m5-modal-sit').style.display = 'none';
    resetarModalSitM5();

    postApi('matriculas.atualizarSituacao', {
      matriculaId: state.matriculaParaSit.MatriculaID,
      novaSituacao: novaSit,
      motivo: motivo || undefined,
    })
      .then(function(res) {
        if (!res.sucesso) { if (typeof toast==='function') toast(res.mensagem||'Erro.','error'); return; }
        if (typeof toast === 'function') toast('Situação atualizada para ' + novaSit + '.', 'success');
        carregarMatriculas();
      })
      .catch(function() { if (typeof toast==='function') toast('Erro de comunicação.','error'); });
  }

  function confirmarCancelamentoM5() {
    var motivo = (el('m5-motivo-texto').value || '').trim();
    if (!motivo) {
      el('m5-motivo-erro').style.display = 'block';
      return;
    }
    alterarSituacao('CANCELADA', motivo);
  }

  // =========================================================
  // MODAL: NOVA MATRÍCULA
  // O aluno pode ser informado por nome (com busca/autocomplete) ou por
  // AlunoID direto — o sistema aceita os dois, mas sempre grava apenas o
  // AlunoID na planilha.
  // =========================================================
  function abrirModalNovaMatricula() {
    state.novaAlunoSel  = null;
    state.novaForcarVaga = false;
    el('m5-nova-aluno-busca').value = '';
    el('m5-nova-aluno-busca').disabled = false;
    el('m5-nova-aluno-busca').style.display = 'block';
    el('m5-nova-aluno-selecionado').classList.remove('show');
    el('m5-nova-aluno-dropdown').classList.remove('show');
    el('m5-nova-aluno-dropdown').innerHTML = '';
    el('m5-nova-turma').value = '';
    el('m5-nova-alerta').classList.remove('show');
    el('m5-nova-aviso-vaga').classList.remove('show');
    el('m5-modal-nova').style.display = 'flex';
    el('m5-nova-aluno-busca').focus();
  }

  function fecharModalNovaMatricula() {
    el('m5-modal-nova').style.display = 'none';
  }

  function mostrarAlertaNovaMat(msg) {
    var a = el('m5-nova-alerta'), m = el('m5-nova-alerta-msg');
    a.classList.add('show'); m.textContent = msg;
  }

  // ── Busca/autocomplete de aluno por nome (reaproveita alunos.listar) ──────
  function buscarAlunosParaCombo(termo) {
    var dropdown = el('m5-nova-aluno-dropdown');
    if (!termo || termo.length < 2) {
      dropdown.classList.remove('show');
      dropdown.innerHTML = '';
      return;
    }
    postApi('alunos.listar', { busca: termo, somenteAtivos: true, tamanhoPagina: 8 })
      .then(function(res) {
        var lista = (res.sucesso && res.dados && res.dados.dados) ? res.dados.dados : [];
        renderizarDropdownAluno(lista, termo);
      })
      .catch(function() { renderizarDropdownAluno([], termo); });
  }

  function renderizarDropdownAluno(lista, termo) {
    var dropdown = el('m5-nova-aluno-dropdown');
    dropdown.innerHTML = '';

    if (lista.length === 0) {
      dropdown.innerHTML = '<div class="m5-aluno-item vazio">Nenhum aluno encontrado para "' + termo + '".</div>';
      dropdown.classList.add('show');
      return;
    }

    lista.forEach(function(a) {
      var item = document.createElement('div');
      item.className = 'm5-aluno-item';
      item.innerHTML = '<span class="m5-ai-nome">' + (a.NomeExibicao || a.NomeCompleto || '—') + '</span>' +
        '<span class="m5-ai-id">' + a.AlunoID + '</span>';
      item.addEventListener('click', function() {
        selecionarAlunoCombo(a.AlunoID, a.NomeExibicao || a.NomeCompleto || a.AlunoID);
      });
      dropdown.appendChild(item);
    });
    dropdown.classList.add('show');
  }

  function selecionarAlunoCombo(alunoId, nomeExibicao) {
    state.novaAlunoSel = { AlunoID: alunoId, NomeExibicao: nomeExibicao };
    el('m5-nova-aluno-dropdown').classList.remove('show');
    el('m5-nova-aluno-busca').value = '';
    el('m5-nova-aluno-busca').style.display = 'none';
    el('m5-nova-aluno-selecionado-txt').textContent = nomeExibicao + ' (' + alunoId + ')';
    el('m5-nova-aluno-selecionado').classList.add('show');
  }

  function limparAlunoCombo() {
    state.novaAlunoSel = null;
    el('m5-nova-aluno-selecionado').classList.remove('show');
    el('m5-nova-aluno-busca').style.display = 'block';
    el('m5-nova-aluno-busca').value = '';
    el('m5-nova-aluno-busca').focus();
  }

  // ── Salvar nova matrícula ───────────────────────────────────────────────
  function salvarNovaMatricula(forcarVaga) {
    el('m5-nova-alerta').classList.remove('show');

    // Resolve o AlunoID: ou veio do combobox, ou o usuário digitou um
    // AlunoID diretamente no campo de busca (sem selecionar da lista).
    var alunoId = state.novaAlunoSel
      ? state.novaAlunoSel.AlunoID
      : (el('m5-nova-aluno-busca').value || '').trim().toUpperCase();
    var turmaId = el('m5-nova-turma').value;

    if (!alunoId) { mostrarAlertaNovaMat('Informe o aluno pelo nome (e selecione na lista) ou pelo AlunoID.'); return; }
    if (!turmaId) { mostrarAlertaNovaMat('Selecione a turma.'); return; }

    el('m5-nova-aviso-vaga').classList.remove('show');
    var btn = el('btn-m5-nova-salvar');
    btn.disabled = true; btn.classList.add('loading');

    var dados = { AlunoID: alunoId, TurmaID: turmaId };
    if (forcarVaga) dados.forcarVaga = true;

    postApi('matriculas.criar', dados)
      .then(function(res) {
        btn.disabled = false; btn.classList.remove('loading');

        if (!res.sucesso) {
          // Vaga acima do limite: back-end pede confirmação explícita
          // (somente para admin/coordenação — outros papéis recebem erro comum).
          if (res.dados && res.dados.confirmacaoNecessaria && state.podeForcarVaga) {
            el('m5-nova-aviso-vaga-msg').textContent = res.mensagem;
            el('m5-nova-aviso-vaga').classList.add('show');
            return;
          }
          mostrarAlertaNovaMat(res.mensagem || 'Erro ao matricular.');
          return;
        }

        fecharModalNovaMatricula();
        var msg = 'Matrícula realizada com sucesso!';
        if (res.dados && res.dados.vagaForcada) msg += ' (Vaga forçada.)';
        if (typeof toast === 'function') toast(msg, 'success');
        state.paginaAtual = 1;
        carregarMatriculas();
      })
      .catch(function() {
        btn.disabled = false; btn.classList.remove('loading');
        mostrarAlertaNovaMat('Erro de comunicação. Tente novamente.');
      });
  }

  // =========================================================
  // EVENTOS
  // =========================================================
  function registrarEventos() {
    // Busca com debounce — envia ao backend para filtrar em todos os registros
    el('m5-busca') && el('m5-busca').addEventListener('input', function() {
      clearTimeout(buscarTimer);
      buscarTimer = setTimeout(function() {
        state.busca = el('m5-busca').value.trim();
        state.paginaAtual = 1;
        carregarMatriculas();
      }, 400);
    });

    // Filtros
    el('m5-filtro-sit') && el('m5-filtro-sit').addEventListener('change', function() {
      state.filtroSit = this.value;
      state.paginaAtual = 1;
      carregarMatriculas();
    });

    el('m5-filtro-turma') && el('m5-filtro-turma').addEventListener('change', function() {
      state.filtroTurma = this.value;
      state.paginaAtual = 1;
      carregarMatriculas();
    });

    // Cards de resumo
    document.querySelectorAll('.m5-resumo-item').forEach(function(card) {
      card.addEventListener('click', function() {
        document.querySelectorAll('.m5-resumo-item').forEach(function(c) { c.classList.remove('sel'); });
        this.classList.add('sel');
        state.filtroSit = this.dataset.sit;
        el('m5-filtro-sit').value = this.dataset.sit;
        state.paginaAtual = 1;
        carregarMatriculas();
      });
    });

    // Modal situação — as 4 opções principais ficam em #m5-sit-opcoes
    el('m5-sit-opcoes') && el('m5-sit-opcoes').querySelectorAll('.m5-sit-opcao').forEach(function(btn) {
      btn.addEventListener('click', function() {
        if (this.dataset.sit === 'CANCELADA') {
          el('m5-sit-opcoes').style.display = 'none';
          el('m5-motivo-wrap').style.display = 'block';
          el('m5-motivo-texto').focus();
          return;
        }
        alterarSituacao(this.dataset.sit);
      });
    });
    el('btn-m5-confirmar-cancelamento') && el('btn-m5-confirmar-cancelamento').addEventListener('click', confirmarCancelamentoM5);
    el('btn-m5-motivo-voltar') && el('btn-m5-motivo-voltar').addEventListener('click', resetarModalSitM5);
    el('m5-motivo-texto') && el('m5-motivo-texto').addEventListener('input', function() {
      el('m5-motivo-erro').style.display = 'none';
    });
    el('btn-cancelar-m5-sit') && el('btn-cancelar-m5-sit').addEventListener('click', fecharModalSitM5);
    el('m5-modal-sit') && el('m5-modal-sit').addEventListener('click', function(e) {
      if (e.target === this) fecharModalSitM5();
    });

    // Modal nova matrícula
    el('btn-m5-nova-matricula') && el('btn-m5-nova-matricula').addEventListener('click', abrirModalNovaMatricula);
    el('btn-m5-nova-cancelar')  && el('btn-m5-nova-cancelar').addEventListener('click', fecharModalNovaMatricula);
    el('btn-m5-nova-salvar')    && el('btn-m5-nova-salvar').addEventListener('click', function() { salvarNovaMatricula(false); });
    el('m5-modal-nova') && el('m5-modal-nova').addEventListener('click', function(e) {
      if (e.target === this) fecharModalNovaMatricula();
    });

    el('m5-nova-aluno-busca') && el('m5-nova-aluno-busca').addEventListener('input', function() {
      var termo = this.value.trim();
      clearTimeout(buscaAlunoTimer);
      buscaAlunoTimer = setTimeout(function() { buscarAlunosParaCombo(termo); }, 300);
    });
    el('m5-nova-aluno-busca') && el('m5-nova-aluno-busca').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') { e.preventDefault(); el('m5-nova-aluno-dropdown').classList.remove('show'); }
    });
    document.addEventListener('click', function(e) {
      var wrap = el('m5-nova-aluno-dropdown');
      if (wrap && !wrap.contains(e.target) && e.target.id !== 'm5-nova-aluno-busca') {
        wrap.classList.remove('show');
      }
    });
    el('m5-nova-aluno-limpar') && el('m5-nova-aluno-limpar').addEventListener('click', limparAlunoCombo);

    el('btn-m5-forcar-confirmar') && el('btn-m5-forcar-confirmar').addEventListener('click', function() {
      salvarNovaMatricula(true);
    });
    el('btn-m5-forcar-cancelar') && el('btn-m5-forcar-cancelar').addEventListener('click', function() {
      el('m5-nova-aviso-vaga').classList.remove('show');
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else { init(); }
}());
</script>
