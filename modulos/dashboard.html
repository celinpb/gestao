<!--
  F_Dashboard.html / dashboard.html
  Tela inicial com atalhos rápidos e painel de ocorrências pendentes.
-->
<style>
  .dash-boas-vindas{margin-bottom:28px;}
  .dash-boas-vindas h2{font-size:22px;font-weight:600;color:var(--c-text-1,#1A1A2E);margin-bottom:4px;}
  .dash-boas-vindas p{font-size:14px;color:var(--c-text-2,#5C5C7A);}
  .dash-semestre-banner{background:#1A1A2E;border-radius:12px;padding:20px 24px;display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;gap:16px;flex-wrap:wrap;}
  .dash-semestre-info{flex:1;}
  .dash-semestre-label{font-size:10.5px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:rgba(255,255,255,0.40);margin-bottom:4px;}
  .dash-semestre-valor{font-size:20px;font-weight:600;color:#FFFFFF;font-family:var(--font-mono,monospace);letter-spacing:0.5px;}
  .dash-semestre-status{display:inline-flex;align-items:center;gap:5px;background:rgba(42,157,143,0.20);color:#5DCAA5;border:1px solid rgba(42,157,143,0.30);border-radius:20px;padding:4px 12px;font-size:11.5px;font-weight:500;}
  .dash-semestre-status .material-icons-round{font-size:13px;}
  .dash-atalhos-titulo{font-size:12px;font-weight:600;letter-spacing:0.8px;text-transform:uppercase;color:var(--c-text-3,#9898B0);margin-bottom:14px;}
  .dash-atalhos{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;margin-bottom:32px;}
  .dash-card{background:#FFFFFF;border:1px solid var(--c-border,#E8E7E2);border-radius:12px;padding:20px;cursor:pointer;transition:box-shadow 180ms ease,transform 180ms ease,border-color 180ms ease;display:flex;flex-direction:column;gap:10px;}
  .dash-card:hover{box-shadow:0 4px 16px rgba(26,26,46,0.10);transform:translateY(-2px);border-color:#D0CFC9;}
  .dash-card-icone{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:rgba(230,57,70,0.08);color:#E63946;}
  .dash-card-icone .material-icons-round{font-size:20px;}
  .dash-card-label{font-size:14px;font-weight:500;color:var(--c-text-1,#1A1A2E);}
  .dash-card-desc{font-size:12px;color:var(--c-text-3,#9898B0);line-height:1.4;}
  .dash-info-sistema{background:#F8F7F3;border:1px solid var(--c-border,#E8E7E2);border-radius:12px;padding:16px 20px;display:flex;align-items:center;gap:12px;font-size:13px;color:var(--c-text-2,#5C5C7A);}
  .dash-info-sistema .material-icons-round{font-size:18px;color:var(--c-text-3,#9898B0);flex-shrink:0;}
  .dash-info-sistema strong{color:var(--c-text-1,#1A1A2E);font-weight:500;}

  /* ── Transição de semestre (etapa 17) ── */
  .dash-ciclo{background:#fff;border:1px solid var(--c-border,#E8E7E2);border-left:4px solid #D4A843;border-radius:12px;padding:18px 20px;margin-bottom:28px;}
  .dash-ciclo-topo{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px;}
  .dash-ciclo-titulo{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;color:var(--c-text-1,#1A1A2E);}
  .dash-ciclo-titulo .material-icons-round{font-size:20px;color:#B8860B;}
  .dash-ciclo-destaque{font-size:12.5px;color:var(--c-text-2,#5C5C7A);}
  .dash-ciclo-destaque strong{color:var(--c-text-1,#1A1A2E);}
  .dash-ciclo-lista{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;}
  .dash-ciclo-item{display:flex;align-items:baseline;gap:12px;padding:7px 0;border-top:1px solid var(--c-border,#E8E7E2);font-size:13px;}
  .dash-ciclo-item:first-child{border-top:none;}
  .dash-ciclo-nome{flex:1;min-width:0;color:var(--c-text-1,#1A1A2E);}
  .dash-ciclo-nome small{display:block;color:var(--c-text-3,#9898B0);font-size:11.5px;}
  .dash-ciclo-datas{font-family:var(--font-mono,monospace);font-size:12px;color:var(--c-text-2,#5C5C7A);white-space:nowrap;}
  .dash-ciclo-selo{flex-shrink:0;display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:99px;font-size:11px;font-weight:600;}
  .dash-ciclo-selo.agora{background:rgba(42,157,143,0.14);color:#1A6E65;}
  .dash-ciclo-selo.proxima{background:rgba(212,168,67,0.18);color:#8A6412;}
  .dash-ciclo-selo.passou{background:#F5F4F0;color:var(--c-text-3,#9898B0);}
  .dash-ciclo-item.passou .dash-ciclo-nome,.dash-ciclo-item.passou .dash-ciclo-datas{color:var(--c-text-3,#9898B0);}
  .dash-ciclo-vazio{font-size:13px;color:var(--c-text-3,#9898B0);}
  @media(max-width:560px){.dash-ciclo-item{flex-wrap:wrap;}.dash-ciclo-datas{white-space:normal;}}

  /* ── Disponibilidade do professor (etapa 19) ── */
  .dash-disp{background:#fff;border:1px solid var(--c-border,#E8E7E2);border-left:4px solid #457B9D;border-radius:12px;padding:18px 20px;margin-bottom:28px;}
  .dash-disp-topo{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:8px;}
  .dash-disp-titulo{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;color:var(--c-text-1,#1A1A2E);}
  .dash-disp-titulo .material-icons-round{font-size:20px;color:#457B9D;}
  .dash-disp-texto{font-size:13px;color:var(--c-text-2,#5C5C7A);line-height:1.5;margin-bottom:12px;}
  .dash-disp-texto strong{color:var(--c-text-1,#1A1A2E);}
  .dash-disp-dias{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-bottom:14px;}
  .dash-disp-dia b{display:block;font-size:11px;font-weight:700;letter-spacing:0.6px;text-transform:uppercase;color:var(--c-text-3,#9898B0);margin-bottom:6px;}
  .dash-disp-slot{display:flex;align-items:center;gap:7px;border:1.5px solid var(--c-border,#E8E7E2);border-radius:7px;padding:6px 9px;margin-bottom:6px;font-size:13px;cursor:pointer;color:var(--c-text-1,#1A1A2E);}
  .dash-disp-slot input{accent-color:#457B9D;width:15px;height:15px;}
  .dash-disp-slot.on{border-color:#457B9D;background:rgba(69,123,157,0.07);}
  .dash-disp-slot.ro{cursor:default;}
  .dash-disp-slot small{color:var(--c-text-3,#9898B0);font-size:11px;margin-left:auto;}
  .dash-disp-rodape{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  .dash-disp-cont{font-size:13px;color:var(--c-text-2,#5C5C7A);}
  .dash-disp-cont.falta{color:#A32D2D;font-weight:600;}
  .dash-disp-btn{height:38px;padding:0 18px;border-radius:8px;border:none;background:#457B9D;color:#fff;font-family:var(--font-sans,sans-serif);font-size:13.5px;font-weight:500;cursor:pointer;}
  .dash-disp-btn:disabled{opacity:0.5;cursor:not-allowed;}
  .dash-disp-extra{display:flex;gap:18px;flex-wrap:wrap;margin:4px 0 14px;}
  .dash-disp-ead{display:flex;flex-direction:column;gap:6px;font-size:13px;min-width:200px;}
  .dash-disp-ead b,.dash-disp-coment b{font-size:12px;color:var(--c-text-2,#5C5C7A);}
  .dash-disp-ead label{display:flex;align-items:center;gap:6px;cursor:pointer;}
  .dash-disp-ead input{accent-color:#457B9D;}
  .dash-disp-coment{flex:1;min-width:240px;display:flex;flex-direction:column;gap:6px;}
  .dash-disp-coment textarea{border:1.5px solid var(--c-border,#E8E7E2);border-radius:7px;padding:7px 9px;font-family:var(--font-sans,sans-serif);font-size:13px;resize:vertical;}
  .dash-rev-overlay{position:fixed;inset:0;background:rgba(26,26,46,0.45);z-index:300;display:flex;align-items:flex-start;justify-content:center;padding:24px 16px;overflow-y:auto;}
  .dash-rev{background:#fff;border-radius:14px;max-width:520px;width:100%;box-shadow:0 12px 48px rgba(26,26,46,0.18);overflow:hidden;}
  .dash-rev-h{padding:16px 20px;border-bottom:1px solid var(--c-border,#E8E7E2);font-weight:600;font-size:15px;}
  .dash-rev-c{padding:16px 20px;font-size:13.5px;line-height:1.55;}
  .dash-rev-c p{margin:8px 0;}
  .dash-rev-tab{border-collapse:collapse;width:100%;font-size:13px;}
  .dash-rev-tab th,.dash-rev-tab td{border:1px solid var(--c-border,#E8E7E2);padding:5px 8px;text-align:left;vertical-align:top;}
  .dash-rev-tab th{background:#F8F7F3;width:100px;}
  .dash-rev-senha{display:flex;flex-direction:column;gap:6px;margin-top:12px;}
  .dash-rev-senha input{height:38px;border:1.5px solid var(--c-border,#E8E7E2);border-radius:7px;padding:0 10px;font-size:14px;}
  .dash-rev-alerta{color:#B01020;font-weight:500;min-height:1em;}
  .dash-rev-f{display:flex;justify-content:flex-end;gap:10px;padding:14px 20px;background:#FAFAF8;border-top:1px solid var(--c-border,#E8E7E2);flex-wrap:wrap;}
  .dash-rev-btn{height:38px;padding:0 16px;border-radius:8px;border:1.5px solid var(--c-border,#E8E7E2);background:#fff;font-size:13.5px;cursor:pointer;font-family:var(--font-sans,sans-serif);}
  .dash-rev-btn.pri{background:#457B9D;border-color:#457B9D;color:#fff;font-weight:500;}
  .dash-rev-btn:disabled{opacity:0.6;cursor:wait;}

  /* ── Idiomas para validar (etapa 25) ── */
  .dash-idi{background:#fff;border:1px solid var(--c-border,#E8E7E2);border-left:4px solid #E9C46A;border-radius:12px;padding:18px 20px;margin-bottom:28px;}
  .dash-idi-titulo{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;color:var(--c-text-1,#1A1A2E);margin-bottom:10px;}
  .dash-idi-titulo .material-icons-round{font-size:20px;color:#B8860B;}
  .dash-idi-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--c-border,#E8E7E2);font-size:13px;flex-wrap:wrap;}
  .dash-idi-item:first-of-type{border-top:none;}
  .dash-idi-nome{flex:1;min-width:180px;color:var(--c-text-1,#1A1A2E);}
  .dash-idi-nome small{display:block;color:var(--c-text-3,#9898B0);font-size:11.5px;}
  .dash-idi-idioma{font-weight:600;}
  .dash-idi-btn{height:28px;padding:0 10px;border-radius:6px;font-size:12px;font-weight:500;cursor:pointer;font-family:var(--font-sans,sans-serif);border:1.5px solid var(--c-border,#E8E7E2);background:#fff;color:var(--c-text-2,#5C5C7A);display:inline-flex;align-items:center;gap:4px;}
  .dash-idi-btn .material-icons-round{font-size:14px;}
  .dash-idi-btn.ok{border-color:rgba(42,157,143,0.4);color:#1A6E65;}
  .dash-idi-btn.nao{border-color:rgba(230,57,70,0.3);color:#A32D2D;}
  .dash-idi-btn:disabled{opacity:0.5;cursor:wait;}

  /* ── Ocorrências pendentes ── */
  .dash-oco-wrap{display:flex;gap:20px;align-items:flex-start;margin-bottom:32px;}
  .dash-oco-lista-wrap{flex:1;min-width:0;}
  .dash-secao-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .dash-secao-titulo{font-size:12px;font-weight:600;letter-spacing:0.8px;text-transform:uppercase;color:var(--c-text-3,#9898B0);}
  .dash-oco-badge{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:#E63946;color:#fff;font-size:11px;font-weight:700;}
  .dash-oco-card{background:#fff;border:1px solid var(--c-border,#E8E7E2);border-radius:10px;padding:13px 15px;margin-bottom:8px;cursor:pointer;transition:border-color 150ms ease,box-shadow 150ms ease;display:flex;align-items:flex-start;gap:12px;}
  .dash-oco-card:hover{border-color:#C8C7C2;box-shadow:0 2px 10px rgba(26,26,46,0.07);}
  .dash-oco-card.selecionado{border-color:#E63946;background:rgba(230,57,70,0.02);}
  .dash-oco-icone{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:16px;}
  .dash-oco-icone.ausencia{background:rgba(233,196,106,0.22);color:#7A5C00;}
  .dash-oco-icone.contato{background:rgba(69,123,157,0.14);color:#185FA5;}
  .dash-oco-icone.pedagogica{background:rgba(42,157,143,0.14);color:#1A6E65;}
  .dash-oco-icone.disciplinar{background:rgba(230,57,70,0.12);color:#A32D2D;}
  .dash-oco-icone.comunicado{background:rgba(26,26,46,0.08);color:#3A3A5C;}
  .dash-oco-icone.outro{background:#F5F4F0;color:#5C5C7A;}
  .dash-oco-corpo{flex:1;min-width:0;}
  .dash-oco-titulo{font-size:13px;font-weight:600;color:var(--c-text-1,#1A1A2E);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .dash-oco-aluno{font-size:12px;color:var(--c-text-2,#5C5C7A);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .dash-oco-restrita{display:inline-flex;align-items:center;gap:3px;padding:1px 6px;border-radius:4px;font-size:10.5px;font-weight:600;background:#2E2A4A;color:#fff;white-space:nowrap;}
  .dash-oco-restrita .material-icons-round{font-size:12px;}
  .dash-oco-card.restrita{border-left:3px solid #2E2A4A;}
  .dash-oco-meta{font-size:11px;color:var(--c-text-3,#9898B0);margin-top:4px;display:flex;gap:8px;flex-wrap:wrap;}
  .dash-oco-tipo{display:inline-flex;padding:1px 7px;border-radius:4px;font-size:10.5px;font-weight:600;}
  .dash-oco-tipo.ausencia{background:rgba(233,196,106,0.22);color:#7A5C00;}
  .dash-oco-tipo.contato{background:rgba(69,123,157,0.14);color:#185FA5;}
  .dash-oco-tipo.pedagogica{background:rgba(42,157,143,0.14);color:#1A6E65;}
  .dash-oco-tipo.disciplinar{background:rgba(230,57,70,0.12);color:#A32D2D;}
  .dash-oco-tipo.comunicado{background:rgba(26,26,46,0.08);color:#3A3A5C;}
  .dash-oco-tipo.outro{background:#F5F4F0;color:#5C5C7A;}
  .dash-oco-vazio{background:#F8F7F3;border:1px dashed var(--c-border,#E8E7E2);border-radius:10px;padding:24px;text-align:center;color:var(--c-text-3,#9898B0);font-size:13px;}
  .dash-oco-spinner{width:20px;height:20px;border:2.5px solid var(--c-border,#E8E7E2);border-top-color:#E63946;border-radius:50%;animation:dash-spin 0.7s linear infinite;margin:20px auto;}
  @keyframes dash-spin{to{transform:rotate(360deg);}}
  .dash-oco-lista-scroll{max-height:420px;overflow-y:auto;scrollbar-width:thin;padding-right:2px;}

  /* ── Painel lateral de detalhe ── */
  .dash-oco-detalhe{width:340px;flex-shrink:0;background:#fff;border:1px solid var(--c-border,#E8E7E2);border-radius:12px;overflow:hidden;display:none;flex-direction:column;}
  .dash-oco-detalhe.aberto{display:flex;}
  .dash-oco-det-header{padding:13px 15px;border-bottom:1px solid var(--c-border,#E8E7E2);display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}
  .dash-oco-det-titulo{font-size:13.5px;font-weight:600;color:var(--c-text-1,#1A1A2E);flex:1;min-width:0;word-break:break-word;}
  .btn-fechar-det{width:26px;height:26px;border-radius:6px;border:none;background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--c-text-3,#9898B0);flex-shrink:0;}
  .btn-fechar-det:hover{background:#F5F4F0;}
  .btn-fechar-det .material-icons-round{font-size:17px;}
  .dash-oco-det-corpo{flex:1;overflow-y:auto;padding:13px 15px;display:flex;flex-direction:column;gap:10px;}
  .dash-oco-det-meta{font-size:11.5px;color:var(--c-text-3,#9898B0);display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
  .dash-oco-det-desc{font-size:12.5px;color:var(--c-text-1,#1A1A2E);line-height:1.6;background:#F8F7F3;border-radius:6px;padding:10px 12px;white-space:pre-wrap;word-break:break-word;}
  .dash-oco-det-thread-titulo{font-size:10px;font-weight:700;letter-spacing:0.8px;text-transform:uppercase;color:var(--c-text-3,#9898B0);margin-top:4px;}
  .dash-oco-msg{display:flex;flex-direction:column;gap:2px;margin-bottom:6px;}
  .dash-oco-msg.minha{align-items:flex-end;}
  .dash-oco-msg-bubble{max-width:92%;background:#F5F4F0;border-radius:8px 8px 8px 2px;padding:7px 10px;font-size:12px;color:var(--c-text-1,#1A1A2E);line-height:1.5;word-break:break-word;}
  .dash-oco-msg.minha .dash-oco-msg-bubble{background:rgba(230,57,70,0.08);border-radius:8px 8px 2px 8px;}
  .dash-oco-msg-autor{font-size:10px;color:var(--c-text-3,#9898B0);}
  .dash-oco-reply-wrap{padding:10px 15px;border-top:1px solid var(--c-border,#E8E7E2);display:flex;gap:6px;align-items:flex-end;flex-shrink:0;}
  .dash-oco-reply-input{flex:1;min-height:34px;max-height:80px;border:1.5px solid var(--c-border,#E8E7E2);border-radius:7px;padding:7px 10px;font-family:var(--font-sans,sans-serif);font-size:12.5px;color:var(--c-text-1,#1A1A2E);background:#FAFAF8;outline:none;resize:none;transition:border-color 150ms ease;}
  .dash-oco-reply-input:focus{border-color:#E63946;background:#fff;}
  .dash-oco-reply-input::placeholder{color:var(--c-text-3,#9898B0);}
  .btn-oco-reply{height:34px;width:34px;border-radius:7px;border:none;background:#E63946;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background 150ms ease;}
  .btn-oco-reply:hover{background:#C1121F;}
  .btn-oco-reply:disabled{opacity:0.5;cursor:not-allowed;}
  .btn-oco-reply .material-icons-round{font-size:17px;}
  .dash-oco-det-acoes{padding:8px 15px;border-top:1px solid var(--c-border,#E8E7E2);display:flex;gap:6px;flex-shrink:0;}
  .btn-oco-resolver{height:28px;padding:0 10px;border-radius:6px;font-size:12px;font-weight:500;cursor:pointer;border:1.5px solid #2A9D8F;background:rgba(42,157,143,0.08);color:#1A6E65;font-family:var(--font-sans,sans-serif);display:inline-flex;align-items:center;gap:4px;transition:background 120ms ease;}
  .btn-oco-resolver:hover{background:rgba(42,157,143,0.18);}
  .btn-oco-resolver .material-icons-round{font-size:14px;}
  .btn-oco-ver-aluno{height:28px;padding:0 10px;border-radius:6px;font-size:12px;font-weight:500;cursor:pointer;border:1.5px solid var(--c-border,#E8E7E2);background:#fff;color:var(--c-text-2,#5C5C7A);font-family:var(--font-sans,sans-serif);display:inline-flex;align-items:center;gap:4px;transition:background 120ms ease;}
  .btn-oco-ver-aluno:hover{background:#F5F4F0;}
  .btn-oco-ver-aluno .material-icons-round{font-size:14px;}
</style>

<div class="dash-boas-vindas">
  <h2 id="dash-titulo">Olá!</h2>
  <p id="dash-subtitulo">Bem-vindo ao Sistema de Gestão Escolar do CELINPB.</p>
</div>

<!-- Banner do semestre -->
<div class="dash-semestre-banner">
  <div class="dash-semestre-info">
    <div class="dash-semestre-label">Semestre em curso</div>
    <div class="dash-semestre-valor" id="dash-semestre">—</div>
  </div>
  <div class="dash-semestre-status" id="dash-status-semestre">
    <span class="material-icons-round">check_circle</span>
    <span>Ativo</span>
  </div>
</div>

<!-- Transição de semestre: datas do ciclo (só aparece com a transição ativada) -->
<div class="dash-ciclo" id="dash-ciclo" style="display:none;"></div>

<!-- Disponibilidade do docente para o próximo semestre (professor e coordenação que leciona, com a transição ativada) -->
<div class="dash-disp" id="dash-disp" style="display:none;"></div>

<!-- Idiomas lecionados aguardando validação (só admin e coordenação, quando houver) -->
<div class="dash-idi" id="dash-idi" style="display:none;"></div>

<!-- Atalhos -->
<div class="dash-atalhos-titulo">Acesso rápido</div>
<div class="dash-atalhos" id="dash-atalhos"></div>

<!-- Ocorrências pendentes -->
<div class="dash-secao-header">
  <span class="dash-secao-titulo">Ocorrências pendentes</span>
  <span class="dash-oco-badge" id="dash-oco-badge" style="display:none;">0</span>
</div>
<div class="dash-oco-wrap" id="dash-oco-wrap">
  <div class="dash-oco-lista-wrap">
    <div class="dash-oco-lista-scroll" id="dash-oco-lista">
      <div class="dash-oco-spinner"></div>
    </div>
  </div>
  <!-- Painel lateral de detalhe -->
  <div class="dash-oco-detalhe" id="dash-oco-detalhe">
    <div class="dash-oco-det-header">
      <span class="dash-oco-det-titulo" id="det-titulo">—</span>
      <button class="btn-fechar-det" id="btn-fechar-det">
        <span class="material-icons-round">close</span>
      </button>
    </div>
    <div class="dash-oco-det-corpo" id="det-corpo">
      <div class="dash-oco-det-meta" id="det-meta"></div>
      <div class="dash-oco-det-desc" id="det-desc"></div>
      <div class="dash-oco-det-thread-titulo">Respostas</div>
      <div id="det-thread"></div>
    </div>
    <div class="dash-oco-det-acoes" id="det-acoes"></div>
    <div class="dash-oco-reply-wrap">
      <textarea class="dash-oco-reply-input" id="det-reply-input"
        placeholder="Escreva uma resposta... (Ctrl+Enter para enviar)" rows="2"></textarea>
      <button class="btn-oco-reply" id="btn-det-reply">
        <span class="material-icons-round">send</span>
      </button>
    </div>
  </div>
</div>

<!-- Info do sistema -->
<div class="dash-info-sistema">
  <span class="material-icons-round">info</span>
  <span>SGE · CELINPB &nbsp;|&nbsp; Versão <strong id="dash-versao">1.0.0</strong> &nbsp;|&nbsp;
  Em caso de dúvidas ou problemas, contate o administrador do sistema.</span>
</div>

<script>
// Protege texto vindo do banco antes de pôr na página (não deixa virar código).
function escTxt(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
(function () {
  'use strict';

  var ATALHOS = {
    admin: [
      { id:'usuarios',   label:'Usuários',     desc:'Gerenciar usuários do sistema',   icone:'people'      },
      { id:'alunos',     label:'Alunos',        desc:'Cadastro e histórico de alunos',  icone:'school'      },
      { id:'turmas',     label:'Turmas',        desc:'Turmas do semestre atual',        icone:'groups'      },
      { id:'matriculas', label:'Matrículas',    desc:'Matrículas e situações',          icone:'assignment'  },
      { id:'relatorios', label:'Relatórios',    desc:'Boletins e listagens',            icone:'summarize'   },
      { id:'config',     label:'Configurações', desc:'Dados e logo da escola',          icone:'settings'    },
    ],
    coordenacao: [
      { id:'alunos',     label:'Alunos',        desc:'Cadastro e histórico de alunos',  icone:'school'      },
      { id:'turmas',     label:'Turmas',        desc:'Turmas do semestre atual',        icone:'groups'      },
      { id:'matriculas', label:'Matrículas',    desc:'Matrículas e situações',          icone:'assignment'  },
      { id:'notas',      label:'Notas',         desc:'Lançamento de notas',             icone:'grade'       },
      { id:'relatorios', label:'Relatórios',    desc:'Boletins e listagens',            icone:'summarize'   },
    ],
    professor: [
      { id:'turmas',     label:'Minhas turmas', desc:'Turmas sob sua responsabilidade', icone:'groups'      },
      { id:'diario',     label:'Diário de aula',desc:'Frequência e conteúdo',           icone:'menu_book'   },
      { id:'notas',      label:'Notas',         desc:'Lançar notas dos alunos',         icone:'grade'       },
    ],
    secretaria: [
      { id:'alunos',     label:'Alunos',        desc:'Cadastro de alunos',              icone:'school'      },
      { id:'turmas',     label:'Turmas',        desc:'Consultar turmas',                icone:'groups'      },
      { id:'matriculas', label:'Matrículas',    desc:'Realizar matrículas',             icone:'assignment'  },
      { id:'relatorios', label:'Relatórios',    desc:'Boletins e listagens',            icone:'summarize'   },
    ],
  };

  // Valores reais de `ocorrencias.tipo` (sem acento — ver f4-alunos.html /
  // oco-tipo select), com as variantes acentuadas mantidas por segurança
  // caso algum registro antigo tenha sido salvo com acento.
  var TIPO_CLASS = {
    'Ausencia avisada':'ausencia','Ausência avisada':'ausencia',
    'Contato com responsavel':'contato','Contato com responsável':'contato',
    'Observacao pedagogica':'pedagogica','Observação pedagógica':'pedagogica',
    'Ocorrencia disciplinar':'disciplinar','Ocorrência disciplinar':'disciplinar',
    'Comunicado interno':'comunicado',
    'Outro':'outro',
  };
  var TIPO_ICONE = {
    ausencia:'notifications_paused', contato:'phone', pedagogica:'psychology',
    disciplinar:'warning', comunicado:'campaign', outro:'note',
  };

  var state = {
    ocorrencias: [],
    ocoSel: null,
    usuarioId: '',
    papel: '',
  };

  function el(id) { return document.getElementById(id); }
  function postApi(acao, dados) { return window.postApi(acao, dados); }

  // Normaliza um registro de `ocorrencias` (snake_case + joins de api.js,
  // ver _ocorrenciasListar) para o formato PascalCase que este arquivo usa —
  // mesmo padrão já aplicado em f4-alunos.html para a mesma ação.
  function normOco(o) {
    if (!o) return o;
    var al = o.alunos || {};
    var nomeSocial = al.nome_social || '';
    return {
      OcorrenciaID:  o.id,
      id:            o.id,
      AlunoID:       o.aluno_id,
      AlunoNome:     nomeSocial || al.nome_completo || '',
      Tipo:          o.tipo || '',
      Titulo:        o.titulo || '',
      Descricao:     o.descricao || '',
      Status:        o.status || '',
      CriadoPor:     o.criado_por_id,
      CriadoPorNome: (o.usuarios && o.usuarios.nome) || '',
      DataCriacao:   o.criado_em || '',
      TurmaID:       o.turma_id || '',
      Restrita:      !!o.restrita,
      Escopo:        o.restrita_escopo || 'coordenacao',
      Permissoes:    o.oco_permissoes || {},   // calculadas no banco (etapa 29)
    };
  }

  // Selo "Restrita à coordenação" (só aparece para quem consegue ver a ocorrência)
  function seloRestrita(o) {
    if (!o || !o.Restrita) return '';
    var rot = o.Escopo === 'coordenacao_idioma' ? 'Restrita à coordenação do idioma' : 'Restrita à coordenação';
    return '<span class="dash-oco-restrita" title="'+escTxt(rot)+'"><span class="material-icons-round">lock</span>'+escTxt(rot)+'</span>';
  }

  function fmtData(d) {
    if (!d) return '—';
    var dt = d instanceof Date ? d : new Date(d);
    if (isNaN(dt.getTime())) return String(d).substring(0,10);
    var pad = function(n){return String(n).padStart(2,'0');};
    return pad(dt.getDate())+'/'+pad(dt.getMonth()+1)+'/'+dt.getFullYear()+
           ' '+pad(dt.getHours())+':'+pad(dt.getMinutes());
  }

  // ── Atalhos ──────────────────────────────────────────────────────────────────
  function renderAtalhos(papel) {
    var atalhos = ATALHOS[papel] || ATALHOS['coordenacao'];
    var grid = el('dash-atalhos');
    if (!grid) return;
    grid.innerHTML = '';
    atalhos.forEach(function(item) {
      var card = document.createElement('div');
      card.className = 'dash-card';
      card.innerHTML =
        '<div class="dash-card-icone"><span class="material-icons-round">'+escTxt(item.icone)+'</span></div>'+
        '<div><div class="dash-card-label">'+escTxt(item.label)+'</div>'+
        '<div class="dash-card-desc">'+escTxt(item.desc)+'</div></div>';
      card.addEventListener('click', function() {
        if (typeof navegarPara === 'function') navegarPara(item.id, item.label);
      });
      grid.appendChild(card);
    });
  }

  // ── Ocorrências ───────────────────────────────────────────────────────────────
  function carregarOcorrencias() {
    // `ocorrencias.listarPendentes` nunca existiu em api.js (era uma rota só
    // do Apps Script) — a ação real é `ocorrencias.listar`, que aceita um
    // filtro `status`. A visibilidade por papel (admin/coordenação veem
    // tudo; professor/secretaria só o que criaram ou onde são destinatários)
    // é responsabilidade do RLS de `ocorrencias` no banco, não deste
    // arquivo — mesmo padrão já usado em f4-alunos.html para a mesma ação.
    postApi('ocorrencias.listar', { status: 'PENDENTE' })
      .then(function(res) {
        state.ocorrencias = (res.sucesso && res.dados) ? res.dados.map(normOco) : [];
        renderOcorrencias();
      })
      .catch(function() {
        state.ocorrencias = [];
        renderOcorrencias();
      });
  }

  function renderOcorrencias() {
    var lista = el('dash-oco-lista');
    var badge = el('dash-oco-badge');
    if (!lista) return;

    var total = state.ocorrencias.length;
    if (badge) {
      badge.textContent = total;
      badge.style.display = total > 0 ? 'inline-flex' : 'none';
    }

    if (total === 0) {
      lista.innerHTML = '<div class="dash-oco-vazio">'+
        '<span class="material-icons-round" style="font-size:28px;display:block;margin:0 auto 8px;color:#C8C7C2;">check_circle</span>'+
        'Nenhuma ocorrência pendente.</div>';
      return;
    }

    lista.innerHTML = '';
    state.ocorrencias.forEach(function(o) {
      var cls = TIPO_CLASS[o.Tipo] || 'outro';
      var icone = TIPO_ICONE[cls] || 'note';
      var card = document.createElement('div');
      card.className = 'dash-oco-card' + (o.Restrita ? ' restrita' : '') + (state.ocoSel && state.ocoSel.OcorrenciaID === o.OcorrenciaID ? ' selecionado' : '');
      card.innerHTML =
        '<div class="dash-oco-icone '+escTxt(cls)+'"><span class="material-icons-round">'+escTxt(icone)+'</span></div>'+
        '<div class="dash-oco-corpo">'+
          '<div class="dash-oco-titulo">'+escTxt(o.Titulo)+'</div>'+
          '<div class="dash-oco-aluno">Aluno: '+(escTxt(o.AlunoNome||o.AlunoID||'—'))+'</div>'+
          '<div class="dash-oco-meta">'+
            seloRestrita(o)+
            '<span class="dash-oco-tipo '+escTxt(cls)+'">'+escTxt(o.Tipo)+'</span>'+
            '<span>'+escTxt(fmtData(o.DataCriacao))+'</span>'+
            '<span>Por: '+(escTxt(o.CriadoPorNome||'—'))+'</span>'+
          '</div>'+
        '</div>';
      card.addEventListener('click', function() { abrirDetalhe(o); });
      lista.appendChild(card);
    });
  }

  // ── Painel de detalhe ─────────────────────────────────────────────────────────
  function abrirDetalhe(oco) {
    state.ocoSel = oco;
    renderOcorrencias(); // atualiza selecionado
    var cls = TIPO_CLASS[oco.Tipo] || 'outro';

    el('det-titulo').textContent = oco.Titulo;
    el('det-meta').innerHTML =
      seloRestrita(oco)+
      '<span class="dash-oco-tipo '+escTxt(cls)+'">'+escTxt(oco.Tipo)+'</span>'+
      '<span>'+escTxt(fmtData(oco.DataCriacao))+'</span>'+
      '<span>Aluno: '+(escTxt(oco.AlunoNome||oco.AlunoID||'—'))+'</span>'+
      '<span>Por: '+(escTxt(oco.CriadoPorNome||'—'))+'</span>';
    el('det-desc').textContent = oco.Descricao || '';
    el('det-thread').innerHTML = '<div class="dash-oco-spinner"></div>';
    el('det-reply-input').value = '';

    // Botões de ação
    var acoes = el('det-acoes');
    acoes.innerHTML = '';
    // Quem pode resolver vem do banco: admin/coordenação; secretaria só nas
    // encaminhadas a ela; professor nas que registrou (etapa 29).
    if (oco.Permissoes && oco.Permissoes.mudar_status) {
      var btnRes = document.createElement('button');
      btnRes.className = 'btn-oco-resolver';
      btnRes.innerHTML = '<span class="material-icons-round">check_circle</span>Marcar resolvida';
      btnRes.addEventListener('click', function() { resolverOco(oco.OcorrenciaID); });
      acoes.appendChild(btnRes);
    }
    // Botão "Ver aluno" — navega para ficha do aluno
    if (typeof navegarPara === 'function' && oco.AlunoID) {
      var btnAluno = document.createElement('button');
      btnAluno.className = 'btn-oco-ver-aluno';
      btnAluno.innerHTML = '<span class="material-icons-round">person</span>Ver aluno';
      btnAluno.addEventListener('click', function() { navegarPara('alunos','Alunos'); });
      acoes.appendChild(btnAluno);
    }

    el('dash-oco-detalhe').classList.add('aberto');
    carregarRespostas(oco.OcorrenciaID);
  }

  function fecharDetalhe() {
    state.ocoSel = null;
    el('dash-oco-detalhe').classList.remove('aberto');
    renderOcorrencias();
  }

  function carregarRespostas(ocoId) {
    // _ocorrenciasListarRespostas (api.js) devolve {id, texto, criado_em,
    // autor_id, autor:{nome}} — sem flag de "é minha", calculada aqui
    // comparando com o usuário logado.
    postApi('ocorrencias.listarRespostas', { ocorrenciaId: ocoId })
      .then(function(res) {
        var lista = (res.sucesso && res.dados) ? res.dados : [];
        renderThread(lista.map(function(r) {
          return {
            Texto:       r.texto || '',
            AutorNome:   (r.autor && r.autor.nome) || '',
            DataCriacao: r.criado_em || '',
            EhMinha:     r.autor_id === state.usuarioId,
          };
        }));
      })
      .catch(function() { renderThread([]); });
  }

  function renderThread(respostas) {
    var cont = el('det-thread');
    if (!cont) return;
    if (!respostas.length) {
      cont.innerHTML = '<p style="font-size:12px;color:var(--c-text-3,#9898B0);text-align:center;padding:8px 0;">Nenhuma resposta ainda.</p>';
      return;
    }
    cont.innerHTML = '';
    respostas.forEach(function(r) {
      var div = document.createElement('div');
      div.className = 'dash-oco-msg' + (r.EhMinha ? ' minha' : '');
      div.innerHTML =
        '<div class="dash-oco-msg-bubble">'+escTxt(r.Texto)+'</div>'+
        '<div class="dash-oco-msg-autor">'+(escTxt(r.EhMinha?'Você':(r.AutorNome||'—')))+' · '+escTxt(fmtData(r.DataCriacao))+'</div>';
      cont.appendChild(div);
    });
    cont.scrollTop = cont.scrollHeight;
  }

  function enviarResposta() {
    if (!state.ocoSel) return;
    var input = el('det-reply-input');
    var texto = (input ? input.value : '').trim();
    if (!texto) return;
    var btn = el('btn-det-reply');
    if (btn) btn.disabled = true;
    postApi('ocorrencias.adicionarResposta', {
      ocorrenciaId: state.ocoSel.OcorrenciaID,
      texto:        texto,
    }).then(function(res) {
      if (btn) btn.disabled = false;
      if (!res.sucesso) { if(typeof toast==='function') toast(res.mensagem||'Erro.','error'); return; }
      if (input) input.value = '';
      carregarRespostas(state.ocoSel.OcorrenciaID);
    }).catch(function() {
      if (btn) btn.disabled = false;
      if(typeof toast==='function') toast('Erro de comunicacao.','error');
    });
  }

  function resolverOco(ocoId) {
    postApi('ocorrencias.atualizarStatus', { ocorrenciaId: ocoId, novoStatus: 'RESOLVIDA' })
      .then(function(res) {
        if (!res.sucesso) { if(typeof toast==='function') toast(res.mensagem||'Erro.','error'); return; }
        if(typeof toast==='function') toast('Ocorrencia marcada como resolvida.','success');
        fecharDetalhe();
        state.ocorrencias = state.ocorrencias.filter(function(o){ return o.OcorrenciaID !== ocoId; });
        renderOcorrencias();
      })
      .catch(function() { if(typeof toast==='function') toast('Erro de comunicacao.','error'); });
  }

  // ── Transição de semestre (etapa 17) ─────────────────────────────────────────
  // App.ciclo vem de index.html (ciclo.estado). Mostra as fases do ciclo que
  // já têm data, para todos os papéis, só enquanto a transição está ativada.
  function escD(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function(c) { return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]; }); }
  function fmtCiclo(iso) {
    if (!iso) return '';
    var d = new Date(iso);
    if (isNaN(d)) return '';
    var dia = d.toLocaleDateString('pt-BR', { timeZone: 'America/Fortaleza', day: '2-digit', month: '2-digit' });
    var hora = d.toLocaleTimeString('pt-BR', { timeZone: 'America/Fortaleza', hour: '2-digit', minute: '2-digit' });
    return hora === '00:00' ? dia : dia + ' ' + hora;
  }
  function renderCiclo() {
    var box = el('dash-ciclo');
    var c = (typeof App !== 'undefined') ? App.ciclo : null;
    if (!box) return;
    if (!c || !c.ativo || !c.proximo) { box.style.display = 'none'; return; }
    var agora = c.agora ? new Date(c.agora).getTime() : Date.now();
    var fases = (c.fases || []).filter(function(f) { return f.inicio || f.fim; });
    var atuais = [], proxima = null;
    fases.forEach(function(f) {
      var ini = f.inicio ? new Date(f.inicio).getTime() : null;
      var fim = f.fim ? new Date(f.fim).getTime() : null;
      if (fim !== null && fim < agora) f._st = 'passou';
      else if (ini !== null && ini > agora) f._st = 'futura';
      else f._st = 'agora';
      if (f._st === 'agora') atuais.push(f);
    });
    fases.forEach(function(f) {
      if (f._st === 'futura' && (!proxima || new Date(f.inicio) < new Date(proxima.inicio))) proxima = f;
    });
    var destaque = '';
    if (atuais.length) destaque = 'Agora: <strong>' + atuais.map(function(f) { return escD(f.nome); }).join(', ') + '</strong>';
    else if (proxima) destaque = 'Próxima: <strong>' + escD(proxima.nome) + '</strong> em ' + escTxt(fmtCiclo(proxima.inicio));
    var itens = fases.map(function(f) {
      var datas = f.inicio && f.fim ? fmtCiclo(f.inicio) + ' a ' + fmtCiclo(f.fim)
                : f.inicio ? 'a partir de ' + fmtCiclo(f.inicio)
                : 'até ' + fmtCiclo(f.fim);
      var selo = f._st === 'agora' ? '<span class="dash-ciclo-selo agora">Agora</span>'
               : f === proxima ? '<span class="dash-ciclo-selo proxima">Próxima</span>'
               : f._st === 'passou' ? '<span class="dash-ciclo-selo passou">Encerrada</span>' : '';
      return '<li class="dash-ciclo-item' + (escTxt(f._st === 'passou' ? ' passou' : '')) + '">' +
        '<span class="dash-ciclo-nome">' + escD(f.nome) + (f.observacao ? '<small>' + escD(f.observacao) + '</small>' : '') + '</span>' +
        '<span class="dash-ciclo-datas">' + escTxt(datas) + '</span>' + selo + '</li>';
    }).join('');
    box.innerHTML =
      '<div class="dash-ciclo-topo">' +
        '<span class="dash-ciclo-titulo"><span class="material-icons-round">published_with_changes</span>Transição para ' + escD(c.proximo.rotulo) + '</span>' +
        (destaque ? '<span class="dash-ciclo-destaque">' + destaque + '</span>' : '') +
      '</div>' +
      (itens ? '<ul class="dash-ciclo-lista">' + itens + '</ul>'
             : '<p class="dash-ciclo-vazio">As datas do ciclo ainda serão divulgadas.</p>');
    box.style.display = '';
  }

  // ── Disponibilidade do docente (etapa 19 + etapa 27) ─────────────────────────
  // O docente marca os horários, responde EAD e (opcional) comenta. Nada é
  // gravado até "Revisar e enviar" → confirmação com a senha. Cada envio fica
  // guardado; o comprovante pode ser impresso/salvo em PDF.
  var DISP_DIAS = ['', 'Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado'];
  var disp = { dados: null, orig: '', ead: null, comentario: '', origEad: null, origComent: '' };
  function fmtDispData(iso) {
    if (!iso) return '';
    var d = new Date(iso); if (isNaN(d)) return '';
    return d.toLocaleDateString('pt-BR', { timeZone: 'America/Fortaleza', day: '2-digit', month: '2-digit' }) + ' às ' +
           d.toLocaleTimeString('pt-BR', { timeZone: 'America/Fortaleza', hour: '2-digit', minute: '2-digit' });
  }
  function carregarDisp() {
    var c = (typeof App !== 'undefined') ? App.ciclo : null;
    if ((state.papel !== 'professor' && state.papel !== 'coordenacao') || !c || !c.ativo || !c.proximo) return;
    postApi('disp.minha', {}).then(function(res) {
      if (!res.sucesso || !res.dados) return;
      disp.dados = res.dados;
      var u = res.dados.ultimo_envio;
      disp.ead = u ? u.ead : null;
      disp.comentario = u && u.comentario ? u.comentario : '';
      disp.origEad = disp.ead; disp.origComent = disp.comentario;
      renderDisp();
    }).catch(function() {});
  }
  function dispMarcados() {
    var ids = [];
    document.querySelectorAll('#dash-disp input[type=checkbox]:checked').forEach(function(c) { ids.push(c.value); });
    return ids;
  }
  function dispMudou() {
    if (!disp.dados || !disp.dados.aberto) return false;
    return dispMarcados().slice().sort().join(',') !== disp.orig || disp.ead !== disp.origEad || (disp.comentario || '') !== (disp.origComent || '');
  }
  function textoMinimo(d) {
    var origem = d.minimo_origem === 'matriculas'
      ? ' (pelas suas matrículas funcionais: turmas + departamento)'
      : d.minimo_origem === 'individual' ? ' (definido pela coordenação)'
      : ' (padrão — sua matrícula funcional ainda não está no cadastro)';
    return 'pelo menos <strong>' + escTxt(d.minimo) + '</strong>' + escD(origem) +
      (d.minimo_sabado ? ', sendo pelo menos <strong>' + escTxt(d.minimo_sabado) + ' no sábado</strong>' : '');
  }
  function renderDisp() {
    var d = disp.dados, box = el('dash-disp'); if (!box || !d) return;
    var slots = d.slots || [], per = d.periodo || {}, u = d.ultimo_envio;
    var agora = Date.now();
    var abre = per.inicio ? new Date(per.inicio).getTime() : null;
    var marcados = slots.filter(function(s) { return s.marcado; });
    var texto;
    if (d.aberto) {
      texto = slots.length
        ? 'Marque os horários em que você pode trabalhar no <strong>' + escD(d.semestre) + '</strong> — ' + textoMinimo(d) + '.' +
          (per.fim ? ' Prazo: até <strong>' + escTxt(fmtDispData(per.fim)) + '</strong>.' : '') + ' Quanto mais horários, mais opções a coordenação tem para montar a grade.'
        : 'A coordenação ainda não cadastrou os horários. Volte mais tarde.';
    } else if (abre && abre > agora) {
      if (!slots.length && !u) { box.style.display = 'none'; return; }
      texto = 'O período para informar sua disponibilidade para o <strong>' + escD(d.semestre) + '</strong> abre em <strong>' + escTxt(fmtDispData(per.inicio)) + '</strong>.';
    } else if (abre) {
      texto = 'O período para informar a disponibilidade terminou.' + (marcados.length ? ' Horários registrados:' : ' Você não enviou disponibilidade; fale com a coordenação.');
    } else {
      box.style.display = 'none'; return;
    }
    var lista = d.aberto ? slots : marcados;
    var porDia = {};
    lista.forEach(function(s) { (porDia[s.dia] = porDia[s.dia] || []).push(s); });
    var grade = Object.keys(porDia).sort().map(function(dia) {
      return '<div class="dash-disp-dia"><b>' + escTxt(DISP_DIAS[dia]) + '</b>' + porDia[dia].map(function(s) {
        return '<label class="dash-disp-slot' + (escTxt(s.marcado ? ' on' : '')) + (escTxt(d.aberto ? '' : ' ro')) + '">' +
          (d.aberto ? '<input type="checkbox" value="' + escD(s.id) + '"' + (escTxt(s.marcado ? ' checked' : '')) + '>' : '') +
          escD(s.horario) + '<small>' + escD(s.turno) + '</small></label>';
      }).join('') + '</div>';
    }).join('');
    var envioTxt = u
      ? '<p class="dash-disp-texto" style="margin-bottom:10px;"><span class="material-icons-round" style="font-size:15px;vertical-align:-3px;color:#2A9D8F;">task_alt</span> ' +
        'Último envio: <strong>nº ' + escTxt(u.numero) + '</strong> em ' + escD(fmtDispData(u.enviado_em)) +
        (u.confirmado_senha ? ' (confirmado com a sua senha)' : ' (registrado por ' + escD(u.registrado_por || 'a coordenação') + ')') +
        ' · EAD: ' + (escTxt(u.ead ? 'sim' : 'não')) +
        ' · <a href="#" id="dash-disp-comp">Ver / imprimir comprovante</a></p>'
      : (d.aberto && slots.length ? '<p class="dash-disp-texto" style="margin-bottom:10px;color:#A32D2D;"><strong>Você ainda não enviou a sua disponibilidade.</strong></p>' : '');
    var form = d.aberto && slots.length
      ? '<div class="dash-disp-extra">' +
          '<div class="dash-disp-ead"><b>Deseja ter turmas na modalidade EAD? <span style="color:#E63946;">*</span></b>' +
            '<label><input type="radio" name="dash-disp-ead" value="sim"' + (escTxt(disp.ead === true ? ' checked' : '')) + '> Sim</label>' +
            '<label><input type="radio" name="dash-disp-ead" value="nao"' + (escTxt(disp.ead === false ? ' checked' : '')) + '> Não</label></div>' +
          '<label class="dash-disp-coment"><b>Comentários ou pedidos específicos (opcional)</b>' +
            '<textarea id="dash-disp-coment" maxlength="2000" rows="2" placeholder="Ex.: prefiro turmas no mesmo turno; não posso às sextas à noite…">' + escD(disp.comentario) + '</textarea></label>' +
        '</div>'
      : '';
    box.innerHTML =
      '<div class="dash-disp-topo"><span class="dash-disp-titulo"><span class="material-icons-round">event_available</span>Sua disponibilidade para ' + escD(d.semestre) + '</span></div>' +
      '<p class="dash-disp-texto">' + texto + '</p>' + envioTxt +
      (grade ? '<div class="dash-disp-dias">' + grade + '</div>' : '') + form +
      (d.aberto && slots.length ? '<div class="dash-disp-rodape"><span class="dash-disp-cont" id="dash-disp-cont"></span>' +
        '<button class="dash-disp-btn" id="dash-disp-revisar">Revisar e enviar</button></div>' : '');
    box.style.display = '';
    if (el('dash-disp-comp')) el('dash-disp-comp').addEventListener('click', function(e) {
      e.preventDefault();
      window.SGE_comprovanteDisp(postApi('disp.comprovante', {})).then(function(res) {
        if (res && !res.sucesso && typeof toast === 'function') toast(escD(res.mensagem || 'Erro.'), 'error');
      });
    });
    if (d.aberto && slots.length) {
      disp.orig = marcados.map(function(s) { return s.id; }).sort().join(',');
      box.querySelectorAll('input[type=checkbox]').forEach(function(c) {
        c.addEventListener('change', function() { c.closest('label').classList.toggle('on', c.checked); atualizarContDisp(); });
      });
      box.querySelectorAll('input[name=dash-disp-ead]').forEach(function(r) {
        r.addEventListener('change', function() { disp.ead = r.value === 'sim'; atualizarContDisp(); });
      });
      el('dash-disp-coment').addEventListener('input', function() { disp.comentario = this.value; atualizarContDisp(); });
      el('dash-disp-revisar').addEventListener('click', abrirRevisao);
      atualizarContDisp();
    }
  }
  function contagem() {
    var ids = dispMarcados(), d = disp.dados;
    var nSab = (d.slots || []).filter(function(s) { return s.dia === 6 && ids.indexOf(s.id) !== -1; }).length;
    return { ids: ids, n: ids.length, nSab: nSab, falta: ids.length < d.minimo || nSab < (d.minimo_sabado || 0) };
  }
  function atualizarContDisp() {
    var c = contagem(), d = disp.dados, cont = el('dash-disp-cont'); if (!cont) return;
    var mudou = dispMudou();
    cont.textContent = c.n + ' marcado(s) · mínimo ' + d.minimo +
      (d.minimo_sabado ? ' · sábado: ' + c.nSab + ' de ' + d.minimo_sabado : '') +
      (disp.ead === null ? ' · responda sobre EAD' : '') + (mudou ? ' · alterações não enviadas' : '');
    cont.className = 'dash-disp-cont' + (c.falta || disp.ead === null ? ' falta' : '');
    el('dash-disp-revisar').disabled = c.falta || disp.ead === null || (!mudou && !!d.ultimo_envio);
    // Avisa antes de sair do Início (ou fechar a aba) com alterações não enviadas
    window.SGE_ANTES_DE_SAIR = mudou ? function() {
      return confirm('Você tem alterações na disponibilidade que ainda NÃO foram enviadas.\n\nSair mesmo assim?');
    } : null;
    window.onbeforeunload = mudou ? function() { return 'Alterações não enviadas.'; } : null;
  }

  // Tela de confirmação: resumo + senha
  function abrirRevisao() {
    var d = disp.dados, c = contagem();
    var porDia = {};
    (d.slots || []).filter(function(s) { return c.ids.indexOf(s.id) !== -1; })
      .forEach(function(s) { (porDia[s.dia] = porDia[s.dia] || []).push(s); });
    var resumo = Object.keys(porDia).sort().map(function(dia) {
      return '<tr><th>' + escTxt(DISP_DIAS[dia]) + '</th><td>' + porDia[dia].map(function(s) { return escD(s.horario) + ' <small>(' + escD(s.turno) + ')</small>'; }).join('<br>') + '</td></tr>';
    }).join('');
    var ov = document.createElement('div');
    ov.className = 'dash-rev-overlay'; ov.id = 'dash-rev';
    ov.innerHTML =
      '<div class="dash-rev"><div class="dash-rev-h">Confirme a sua disponibilidade — ' + escD(d.semestre) + '</div>' +
      '<div class="dash-rev-c">' +
        '<p><strong>' + escTxt(c.n) + '</strong> horário(s) marcado(s) (mínimo ' + escTxt(d.minimo) + (escTxt(d.minimo_sabado ? ', sendo ' + d.minimo_sabado + ' no sábado' : '')) + '):</p>' +
        '<table class="dash-rev-tab">' + resumo + '</table>' +
        '<p><strong>Deseja turmas EAD?</strong> ' + (escTxt(disp.ead ? 'Sim' : 'Não')) + '</p>' +
        '<p><strong>Comentários:</strong> ' + (disp.comentario.trim() ? escD(disp.comentario.trim()).replace(/\n/g, '<br>') : '<span style="color:#9898B0;">(nenhum)</span>') + '</p>' +
        '<label class="dash-rev-senha"><b>Para confirmar o envio, digite a sua senha do SGE:</b>' +
          '<input type="password" id="dash-rev-senha" autocomplete="current-password"></label>' +
        '<p class="dash-rev-alerta" id="dash-rev-alerta"></p>' +
        '<p style="font-size:12px;color:#9898B0;">Depois de enviar, abre o comprovante para imprimir ou salvar em PDF. Enquanto o período estiver aberto, você pode enviar de novo: vale o último envio.</p>' +
      '</div><div class="dash-rev-f">' +
        '<button type="button" class="dash-rev-btn" id="dash-rev-voltar">Voltar e corrigir</button>' +
        '<button type="button" class="dash-rev-btn pri" id="dash-rev-ok">Confirmar e enviar</button>' +
      '</div></div>';
    document.body.appendChild(ov);
    el('dash-rev-senha').focus();
    el('dash-rev-voltar').addEventListener('click', function() { ov.remove(); });
    el('dash-rev-senha').addEventListener('keydown', function(e) { if (e.key === 'Enter') el('dash-rev-ok').click(); });
    el('dash-rev-ok').addEventListener('click', function() {
      var senha = el('dash-rev-senha').value;
      if (!senha) { el('dash-rev-alerta').textContent = 'Digite a sua senha.'; return; }
      var btn = el('dash-rev-ok'); btn.disabled = true; btn.textContent = 'Enviando…';
      var envio = postApi('disp.enviar', { senha: senha, slot_ids: c.ids, ead: disp.ead, comentario: disp.comentario.trim() });
      // A janela do comprovante é aberta já no clique (senão o navegador bloqueia)
      window.SGE_comprovanteDisp(envio).then(function(res) {
        if (!res || !res.sucesso) {
          btn.disabled = false; btn.textContent = 'Confirmar e enviar';
          el('dash-rev-alerta').textContent = (res && res.mensagem) || 'Erro de comunicação.';
          return;
        }
        ov.remove();
        window.SGE_ANTES_DE_SAIR = null; window.onbeforeunload = null;
        if (typeof toast === 'function') toast('Disponibilidade enviada (envio nº ' + res.dados.numero + ').', 'success', 6000);
        carregarDisp();
      });
    });
  }

  // ── Idiomas para validar (etapa 25) ─────────────────────────────────────────
  var ROTULO_PAPEL_D = { admin:'Admin', coordenacao:'Coordenação', professor:'Professor', secretaria:'Secretaria' };
  var idiPend = [];
  function carregarIdiomasPendentes() {
    if (state.papel !== 'admin' && state.papel !== 'coordenacao') return;
    postApi('idiomas.pendentes', {}).then(function(res) {
      idiPend = (res.sucesso && res.dados) ? res.dados : [];
      renderIdiomasPendentes();
    }).catch(function() {});
  }
  function renderIdiomasPendentes() {
    var box = el('dash-idi'); if (!box) return;
    if (!idiPend.length) { box.style.display = 'none'; box.innerHTML = ''; return; }
    box.innerHTML =
      '<div class="dash-idi-titulo"><span class="material-icons-round">translate</span>Idiomas para validar' +
        ' <span class="dash-oco-badge">' + idiPend.length + '</span></div>' +
      idiPend.map(function(p, i) {
        return '<div class="dash-idi-item">' +
          '<span class="dash-idi-nome">' + escD(p.nome) + ' — <span class="dash-idi-idioma">' + escD(p.idioma) + '</span>' +
            '<small>' + escD(ROTULO_PAPEL_D[p.papel] || p.papel) + ' · ' + escD(p.codigo || '') + ' · marcado em ' + escD(fmtData(p.marcado_em)) + '</small></span>' +
          '<button class="dash-idi-btn ok" type="button" data-i="' + escTxt(i) + '" data-a="sim"><span class="material-icons-round">check</span>Validar</button>' +
          '<button class="dash-idi-btn nao" type="button" data-i="' + escTxt(i) + '" data-a="nao"><span class="material-icons-round">close</span>Recusar</button>' +
          '<button class="dash-idi-btn" type="button" data-i="' + escTxt(i) + '" data-a="cad"><span class="material-icons-round">badge</span>Cadastro</button>' +
          '</div>';
      }).join('');
    box.style.display = '';
    box.querySelectorAll('button[data-a]').forEach(function(b) {
      b.addEventListener('click', function() {
        var p = idiPend[Number(b.getAttribute('data-i'))]; if (!p) return;
        var a = b.getAttribute('data-a');
        if (a === 'cad') {
          window.SGE_ABRIR_CADASTRO = p.usuario_id;
          if (typeof navegarPara === 'function') navegarPara('usuarios', 'Usuários');
          return;
        }
        var aprovar = a === 'sim';
        if (!aprovar && !confirm('Recusar o idioma ' + p.idioma + ' para ' + p.nome + '?\n\nA marcação será apagada.')) return;
        b.disabled = true;
        postApi('idiomas.validar', { usuario_id: p.usuario_id, idioma_id: p.idioma_id, aprovar: aprovar }).then(function(res) {
          if (typeof toast === 'function') toast(escD(res.mensagem || (res.sucesso ? 'Feito.' : 'Erro.')), res.sucesso ? 'success' : 'error');
          carregarIdiomasPendentes();
        }).catch(function() { b.disabled = false; if (typeof toast === 'function') toast('Erro de comunicação.', 'error'); });
      });
    });
  }

  // ── Init ──────────────────────────────────────────────────────────────────────
  function init() {
    // App.usuario/App.semestre vêm de index.html (onLoginSucesso/carregarShell)
    // e carregam, respectivamente, o registro de `usuarios` e de `semestres`
    // direto do Supabase — ambos em snake_case (papel, id, rotulo,
    // edicao_ativa...), não no PascalCase do sistema antigo.
    var usuario  = (typeof App !== 'undefined') ? App.usuario  : null;
    var semestre = (typeof App !== 'undefined') ? App.semestre : null;

    if (usuario) {
      var primeiroNome = (usuario.nome || usuario.Nome || '').split(' ')[0];
      var tituloEl = el('dash-titulo');
      if (tituloEl) tituloEl.textContent = 'Olá, ' + primeiroNome + '!';
      state.usuarioId = usuario.id || '';
      state.papel     = usuario.papel || usuario.Papel || '';
    }

    var semestreEl = el('dash-semestre');
    if (semestreEl && semestre) {
      semestreEl.textContent = semestre.rotulo || semestre.external_id || '—';
      var statusEl = el('dash-status-semestre');
      if (statusEl && semestre.edicao_ativa === false) {
        statusEl.style.background  = 'rgba(230,57,70,0.15)';
        statusEl.style.color       = '#E63946';
        statusEl.style.borderColor = 'rgba(230,57,70,0.25)';
        statusEl.innerHTML = '<span class="material-icons-round">lock</span><span>Fechado para edição</span>';
      }
    } else if (semestreEl) {
      semestreEl.textContent = 'Nenhum semestre ativo';
    }

    renderCiclo();
    carregarDisp();
    carregarIdiomasPendentes();
    renderAtalhos(state.papel);
    carregarOcorrencias();

    // Eventos
    el('btn-fechar-det') && el('btn-fechar-det').addEventListener('click', fecharDetalhe);
    el('btn-det-reply')  && el('btn-det-reply').addEventListener('click', enviarResposta);
    el('det-reply-input') && el('det-reply-input').addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) enviarResposta();
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
}());
</script>
